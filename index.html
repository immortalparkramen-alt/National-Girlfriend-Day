<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Closing the Distance</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Love+Light&family=Love+Ya+Like+A+Sister&display=swap');
    :root {
      --pink: #ff78b4;
      --deep-pink: #d92f7b;
      --cream: #fff5fb;
      --dark: #100916;
      --panel: rgba(19, 9, 27, 0.78);
      --hud-text: #ffe8f4;
      --key-bg: rgba(93, 25, 69, .82);
      --key-text: #ffd9eb;
      --key-active: rgba(219, 69, 139, .70);
      --progress-a: #ff6cae;
      --progress-b: #ffd2e7;
      --track-bg: rgba(255,255,255,.12);
      --track-border: rgba(255,255,255,.13);
      --ending-overlay: rgba(0,0,0,.38);
      --ending-card-bg: rgba(20, 8, 28, .88);
      --ending-glow: rgba(255, 101, 174, .24);
      --ending-title: #fff5fb;
      --ending-copy: #ead2df;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--cream);
      font-family: "Love Ya Like A Sister", cursive;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 95, 170, .16), transparent 34%),
        #000;
      z-index: 10;
      text-align: center;
      transition: opacity .7s ease;
    }

    #startScreen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-card {
      position: relative;
      display: grid;
      place-items: center;
      width: auto;
      padding: 44px 54px 48px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      isolation: isolate;
    }

    .start-card::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 260px;
      height: 160px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(205, 83, 145, .22) 0%,
          rgba(142, 47, 104, .11) 42%,
          transparent 72%
        );
      filter: blur(10px);
      animation: beginGlow 2.8s ease-in-out infinite;
    }

    .start-card::after {
      content: "✦  ·  ♡  ·  ✦";
      position: absolute;
      bottom: 13px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 172, 210, .72);
      font-family: "Love Ya Like A Sister", cursive;
      font-size: .9rem;
      letter-spacing: .16em;
      white-space: nowrap;
      text-shadow: 0 0 12px rgba(255, 103, 174, .30);
      animation: beginTwinkle 2.4s ease-in-out infinite;
    }

    .tiny {
      margin: 0 0 10px;
      color: #ff9fc9;
      letter-spacing: .18em;
      text-transform: uppercase;
      font-size: .75rem;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 clamp(22px, 5vw, 32px);
      font-family: "Love Light", cursive;
      font-size: clamp(2.4rem, 8vw, 4.85rem);
      font-weight: 400;
      line-height: .98;
      letter-spacing: .008em;
      word-spacing: .045em;
      white-space: nowrap;
    }

    .start-card p {
      margin: 0 auto;
      max-width: 430px;
      color: #d9bfd0;
      line-height: 1.65;
    }

    #startButton {
      position: relative;
      min-width: 154px;
      border: 1px solid rgba(255, 216, 233, .34);
      border-radius: 999px;
      padding: 14px 31px;
      color: #fff1f7;
      background:
        linear-gradient(
          180deg,
          rgba(142, 55, 102, .98),
          rgba(87, 31, 70, .98)
        );
      font-family: "Love Ya Like A Sister", cursive;
      font-size: clamp(1.15rem, 3.4vw, 1.35rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: .045em;
      cursor: pointer;
      box-shadow:
        0 13px 30px rgba(45, 10, 35, .44),
        0 0 24px rgba(211, 85, 145, .17),
        inset 0 1px 0 rgba(255,255,255,.20),
        inset 0 -7px 16px rgba(52, 12, 41, .17);
      text-shadow: 0 1px 4px rgba(39, 7, 30, .34);
      animation: beginFloat 2.8s ease-in-out infinite;
      transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
    }

    #startButton::before,
    #startButton::after {
      position: absolute;
      top: 50%;
      color: rgba(255, 173, 211, .84);
      font-family: "Love Ya Like A Sister", cursive;
      font-size: 1rem;
      text-shadow: 0 0 10px rgba(255, 104, 175, .38);
      pointer-events: none;
    }

    #startButton::before {
      content: "♡";
      left: -29px;
      transform: translateY(-50%) rotate(-10deg);
    }

    #startButton::after {
      content: "♡";
      right: -29px;
      transform: translateY(-50%) rotate(10deg);
    }

    #startButton:hover {
      transform: translateY(-3px) scale(1.035);
      filter: brightness(1.08);
      box-shadow:
        0 17px 38px rgba(45, 10, 35, .50),
        0 0 31px rgba(224, 104, 159, .24),
        inset 0 1px 0 rgba(255,255,255,.24),
        inset 0 -7px 16px rgba(52, 12, 41, .14);
    }

    #startButton:focus-visible {
      outline: 3px solid rgba(255, 188, 218, .58);
      outline-offset: 6px;
    }

    #startButton:active {
      transform: translateY(0) scale(.97);
      filter: brightness(.96);
    }

    @keyframes beginFloat {
      50% {
        translate: 0 -3px;
      }
    }

    @keyframes beginGlow {
      50% {
        transform: scale(1.08);
        opacity: .82;
      }
    }

    @keyframes beginTwinkle {
      50% {
        opacity: .48;
        letter-spacing: .20em;
      }
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    #message {
      position: absolute;
      top: 22px;
      left: 50%;
      width: max-content;
      min-width: min(240px, calc(100% - 32px));
      max-width: min(520px, calc(100% - 32px));
      transform: translateX(-50%);
      padding: 11px 15px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 16px;
      background: var(--panel);
      text-align: center;
      color: var(--hud-text);
      opacity: 0;
      transition: opacity .25s ease;
      backdrop-filter: blur(10px);
    }

    #message.show { opacity: 1; }

    #progressWrap {
      position: absolute;
      top: 20px;
      right: 20px;
      width: min(220px, 34vw);
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--track-bg);
      border: 1px solid var(--track-border);
    }

    #progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--progress-a), var(--progress-b));
      transition: width .35s ease;
    }

    #controls {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: none;
      gap: 10px;
      z-index: 5;
      pointer-events: auto;
    }

    #controls.show { display: flex; }

    .key {
      width: 58px;
      height: 58px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 17px;
      color: var(--key-text);
      background: var(--key-bg);
      font-family: "Love Ya Like A Sister", cursive;
      font-size: 26px;
      font-weight: 400;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 22px rgba(0,0,0,.28);
      transition: transform .12s ease, background .12s ease;
    }

    .key:active {
      transform: scale(.92);
      background: var(--key-active);
    }

    .key.correct-glow {
      animation: correctKeyGlow .58s cubic-bezier(.16,.84,.28,1);
    }

    .key.incorrect-glow {
      animation: incorrectKeyGlow .62s cubic-bezier(.22,.74,.30,1);
    }

    @keyframes correctKeyGlow {
      0% {
        transform: scale(1);
        filter: brightness(1);
        box-shadow: 0 8px 22px rgba(0,0,0,.28);
      }
      34% {
        transform: translateY(-3px) scale(1.10);
        color: #fff;
        background: rgba(255, 124, 181, .94);
        filter: brightness(1.17);
        box-shadow:
          0 0 0 3px rgba(255, 209, 229, .15),
          0 0 19px rgba(255, 101, 170, .72),
          0 11px 25px rgba(76, 20, 57, .35);
      }
      68% {
        transform: translateY(-1px) scale(1.045);
        color: #fff;
        background: rgba(238, 104, 163, .88);
        box-shadow:
          0 0 0 6px rgba(255, 209, 229, 0),
          0 0 13px rgba(255, 126, 183, .46),
          0 9px 22px rgba(76, 20, 57, .30);
      }
      100% {
        transform: scale(1);
        filter: brightness(1);
        box-shadow: 0 8px 22px rgba(0,0,0,.28);
      }
    }

    @keyframes incorrectKeyGlow {
      0% {
        transform: translateX(0) scale(1);
        filter: brightness(1);
        box-shadow: 0 8px 22px rgba(0,0,0,.28);
      }
      18% {
        transform: translateX(-5px) scale(1.04);
      }
      34% {
        transform: translateX(5px) scale(1.07);
        color: #fff6f6;
        background: rgba(180, 45, 68, .96);
        filter: brightness(1.10);
        box-shadow:
          0 0 0 3px rgba(255, 158, 167, .16),
          0 0 19px rgba(255, 65, 91, .70),
          0 10px 25px rgba(66, 10, 25, .38);
      }
      50% {
        transform: translateX(-4px) scale(1.05);
      }
      66% {
        transform: translateX(3px) scale(1.025);
        color: #fff6f6;
        background: rgba(147, 39, 61, .92);
        box-shadow:
          0 0 0 7px rgba(255, 132, 145, 0),
          0 0 13px rgba(255, 76, 97, .46),
          0 9px 22px rgba(66, 10, 25, .32);
      }
      82% {
        transform: translateX(-1px) scale(1.01);
      }
      100% {
        transform: translateX(0) scale(1);
        filter: brightness(1);
        box-shadow: 0 8px 22px rgba(0,0,0,.28);
      }
    }


    #cinematicNote {
      position: fixed;
      inset: 0;
      z-index: 7;
      display: grid;
      place-items: center;
      padding: clamp(22px, 5vw, 58px);
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 48%,
          rgba(111, 40, 82, .24),
          transparent 48%
        ),
        rgba(9, 3, 12, .74);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity .58s ease,
        visibility 0s linear .58s;
    }

    #cinematicNote::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, .44),
          transparent 24%,
          transparent 76%,
          rgba(0, 0, 0, .52)
        );
      pointer-events: none;
    }

    #cinematicNote.show {
      opacity: 1;
      visibility: visible;
      transition:
        opacity .58s ease,
        visibility 0s linear 0s;
    }

    .cinematic-frame {
      position: relative;
      width: min(850px, 100%);
      min-height: clamp(230px, 38vh, 330px);
      display: grid;
      align-content: center;
      padding:
        clamp(38px, 7vw, 68px)
        clamp(24px, 7vw, 72px);
      border-top: 1px solid rgba(255, 212, 231, .33);
      border-bottom: 1px solid rgba(255, 212, 231, .33);
      text-align: center;
      opacity: 0;
      transform: translateY(16px) scale(.985);
      transition:
        opacity .64s ease .12s,
        transform .82s cubic-bezier(.16,.82,.24,1) .08s;
    }

    #cinematicNote.show .cinematic-frame {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .cinematic-frame::before,
    .cinematic-frame::after {
      content: "✦";
      position: absolute;
      top: 50%;
      translate: 0 -50%;
      color: rgba(255, 173, 210, .65);
      font-family: Georgia, serif;
      font-size: .82rem;
      text-shadow: 0 0 15px rgba(255, 101, 169, .48);
    }

    .cinematic-frame::before { left: 4px; }
    .cinematic-frame::after { right: 4px; }

    #cinematicPlatform {
      margin-bottom: 18px;
      color: rgba(255, 184, 215, .78);
      font-family: "Love Ya Like A Sister", cursive;
      font-size: clamp(.72rem, 1.8vw, .88rem);
      font-weight: 400;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    #cinematicText {
      width: min(680px, 100%);
      max-width: 680px;
      min-height: 5.6em;
      margin: 0 auto;
      color: #fff4f9;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      text-align: left;
      text-wrap: wrap;
      font-family: "Love Ya Like A Sister", cursive;
      font-size: clamp(1.12rem, 2.8vw, 1.62rem);
      font-weight: 400;
      line-height: 1.68;
      letter-spacing: .01em;
      text-shadow:
        0 2px 18px rgba(0, 0, 0, .72),
        0 0 22px rgba(255, 129, 184, .10);
    }

    .cinematic-char {
      display: inline;
      opacity: 0;
      filter: blur(1.8px);
      animation:
        cinematicCharacterIn
        .20s
        cubic-bezier(.18,.78,.28,1)
        forwards;
    }

    #cinematicText.typing::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 1.08em;
      margin-left: 5px;
      vertical-align: -.12em;
      background: rgba(255, 199, 224, .92);
      box-shadow: 0 0 9px rgba(255, 124, 182, .62);
      animation: cinematicCursor .82s steps(1) infinite;
    }

    .cinematic-heart {
      margin-top: 20px;
      color: rgba(255, 157, 201, .82);
      font-family: Georgia, serif;
      font-size: 1.05rem;
      letter-spacing: .22em;
      opacity: .86;
    }

    body.cinematic-active #hud {
      opacity: 0;
    }

    #hud {
      transition: opacity .32s ease;
    }

    @keyframes cinematicCharacterIn {
      0% {
        opacity: 0;
        filter: blur(1.8px);
        text-shadow: 0 0 9px rgba(255, 175, 213, .20);
      }
      55% {
        opacity: .72;
        filter: blur(.5px);
      }
      100% {
        opacity: 1;
        filter: blur(0);
        text-shadow: inherit;
      }
    }

    @keyframes cinematicCursor {
      50% { opacity: 0; }
    }

    #ending {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: var(--ending-overlay);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      backdrop-filter: blur(0);
      transition:
        opacity 1.45s ease,
        backdrop-filter 1.65s ease,
        visibility 0s linear 1.65s;
    }

    #ending.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      backdrop-filter: blur(7px);
      transition:
        opacity 1.45s ease,
        backdrop-filter 1.65s ease,
        visibility 0s linear 0s;
    }

    .ending-card {
      position: relative;
      width: min(700px, 100%);
      padding: 42px 30px 36px;
      overflow: hidden;
      border-radius: 34px;
      border: 1px solid rgba(255,255,255,.24);
      background:
        radial-gradient(circle at 50% -10%, var(--ending-glow), transparent 53%),
        var(--ending-card-bg);
      box-shadow:
        0 24px 90px rgba(255, 74, 151, .25),
        inset 0 1px 0 rgba(255,255,255,.22);
      opacity: 0;
      transform: translateY(24px) scale(.965);
      filter: blur(8px);
      transition:
        opacity 1.4s ease .20s,
        transform 1.75s cubic-bezier(.16,.82,.24,1) .12s,
        filter 1.45s ease .15s;
    }

    #ending.show .ending-card {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .ending-card::before,
    .ending-card::after {
      position: absolute;
      color: #ff9fc6;
      opacity: .58;
      font-family: "Love Ya Like A Sister", cursive;
      pointer-events: none;
      animation: floatCute 2.6s ease-in-out infinite;
    }

    .ending-card::before {
      content: "♡  ✦";
      top: 22px;
      left: 28px;
      font-size: 1.45rem;
      transform: rotate(-8deg);
    }

    .ending-card::after {
      content: "✦  ♡";
      right: 28px;
      bottom: 24px;
      font-size: 1.35rem;
      transform: rotate(8deg);
      animation-delay: -.9s;
    }

    .ending-kicker {
      margin: 4px 0 0 !important;
      color: #ff9fc6 !important;
      font-size: 1rem !important;
      letter-spacing: .04em;
    }

    .ending-card h2 {
      margin: 2px 0 10px;
      font-family: "Love Light", cursive;
      color: var(--ending-title);
      font-size: clamp(3.1rem, 9vw, 5.6rem);
      line-height: 1.05;
      letter-spacing: .005em;
    }

    .heart-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: -2px 0 15px;
      color: #ff91bd;
      font-size: 1.15rem;
    }

    .heart-row span:nth-child(2) {
      font-size: .8rem;
      opacity: .8;
    }

    .ending-card p {
      margin: 0 auto 24px;
      max-width: 585px;
      color: var(--ending-copy);
      line-height: 1.7;
      font-size: 1.08rem;
    }

    .forever-pill {
      display: inline-block;
      margin: 0 auto 22px;
      padding: 9px 16px;
      border: 1px solid rgba(255, 145, 190, .34);
      border-radius: 999px;
      color: var(--ending-copy);
      background: rgba(255, 132, 182, .10);
      font-size: .94rem;
    }

    .ending-main-heart {
      margin-bottom: -4px;
      filter: drop-shadow(0 8px 18px rgba(255, 87, 157, .28));
    }

    .heart {
      font-size: 4.35rem;
      animation: beat 1.1s infinite;
    }


    @keyframes floatCute {
      50% { translate: 0 -7px; }
    }

    @keyframes beat {
      50% { transform: scale(1.14); }
    }

    @media (max-width: 600px) {
      .start-card h1 {
        font-size: clamp(2rem, 11.2vw, 3.2rem);
        letter-spacing: 0;
        word-spacing: .02em;
      }

      #progressWrap {
        top: auto;
        bottom: 92px;
        left: 50%;
        right: auto;
        width: min(320px, calc(100% - 28px));
        transform: translateX(-50%);
      }

      #message { top: 14px; }

      .cinematic-frame {
        min-height: 270px;
        padding: 38px 22px;
      }

      #cinematicText {
        width: min(560px, 100%);
        max-width: 560px;
        min-height: 7.2em;
        font-size: clamp(1rem, 4.6vw, 1.22rem);
        line-height: 1.62;
      }

      .key {
        width: 54px;
        height: 54px;
        font-size: 26px;
        font-weight: 400;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="startScreen">
    <div class="start-card">
      <button id="startButton">Begin</button>
    </div>
  </div>

  <div id="hud">
    <div id="message"></div>
    <div id="progressWrap"><div id="progress"></div></div>
  </div>


  <div
    id="cinematicNote"
    role="dialog"
    aria-modal="true"
    aria-live="polite"
    aria-label="Love note"
  >
    <div class="cinematic-frame">
      <div id="cinematicPlatform"></div>
      <p id="cinematicText"></p>
      <div class="cinematic-heart" aria-hidden="true">♡ · ✦ · ♡</div>
    </div>
  </div>

  <div id="controls" aria-label="Game controls">
    <button class="key" data-key="A">A</button>
    <button class="key" data-key="W">W</button>
    <button class="key" data-key="S">S</button>
    <button class="key" data-key="D">D</button>
  </div>

  <div id="ending">
    <div class="ending-card">
      <div class="heart ending-main-heart">💗</div>
      <h2>Together Forever!</h2>
      <div class="heart-row" aria-hidden="true"><span>♡</span><span>✦</span><span>♡</span></div>
      <p id="endingText"></p>
      <div class="forever-pill">Happy Girlfriends Day My Love ♡</div>
    </div>
  </div>

  <audio id="backgroundMusic" loop preload="auto" playsinline src="background.mp3"></audio>
  <audio id="voice1" preload="auto" src="voice1.mp3"></audio>
  <audio id="voice2" preload="auto" src="voice2.mp3"></audio>
  <audio id="voice3" preload="auto" src="voice3.mp3"></audio>
  <audio id="voice4" preload="auto" src="voice4.mp3"></audio>
  <audio id="voice5" preload="auto" src="voice5.mp3"></audio>
  <audio id="voice6" preload="auto" src="voice6.mp3"></audio>
  <audio id="introVoice" preload="auto" src="intro_voice.mp3"></audio>

<script>
(() => {
  "use strict";

  const CONFIG = {
    herName: "Treiorika",
    yourName: "Kyle",
    title: "Closing the Distance",
    endingMessage:
      "You made it baby, now you're here with me, right where you belong. No ocean, mountain, or time zone can get in between us, our love is stronger than all of that. No matter how long it takes, one day, we will be together. I love you, more than anything and everything, always and forever.",
    voiceNotes: [
      {
        platform: 20,
        audioId: "voice1",
        audioDuration: 9.864,
        typingDuration: 9.314,
        caption:
          "It's crazy how far we've come, I can still remember the day we first met. Ever since fate let us unite, we've been inseparable."
      },
      {
        platform: 40,
        audioId: "voice2",
        audioDuration: 8.616,
        typingDuration: 8.066,
        caption:
          "Being your boyfriend is the greatest thing ever, and what makes it even better is that I get to be with you every single day."
      },
      {
        platform: 60,
        audioId: "voice3",
        audioDuration: 7.776,

  function ensureAudio() {
    if (audioContext) {
      if (audioContext.state === "suspended") audioContext.resume();
      return;
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;

    audioContext = new AudioCtx();
    effectsGain = audioContext.createGain();
    effectsGain.gain.value = 0.24;
    effectsGain.connect(audioContext.destination);

    attachVoiceNoteDucking();
  }

  function startBackgroundMusic() {

  function playJumpSound() {
    ensureAudio();
    if (!audioContext || !effectsGain || !audioEnabled) return;

    const now = audioContext.currentTime;
    const jumpGain = audioContext.createGain();
    const jumpTone = audioContext.createOscillator();
    const sparkle = audioContext.createOscillator();

    jumpTone.type = "sine";
    jumpTone.frequency.setValueAtTime(285, now);
    jumpTone.frequency.exponentialRampToValueAtTime(610, now + 0.16);

    sparkle.type = "triangle";
    sparkle.frequency.setValueAtTime(520, now);
    sparkle.frequency.exponentialRampToValueAtTime(870, now + 0.12);

    jumpGain.gain.setValueAtTime(0.0001, now);
    jumpGain.gain.exponentialRampToValueAtTime(0.19, now + 0.012);
    jumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.21);

    jumpTone.connect(jumpGain);
    sparkle.connect(jumpGain);
    jumpGain.connect(effectsGain);

    jumpTone.start(now);
    sparkle.start(now);
    jumpTone.stop(now + 0.22);
    sparkle.stop(now + 0.18);
  }

  function setMusicLevel(level) {
    backgroundMusic.volume = Math.max(0, Math.min(1, level));
  }

  function fadeMusicTo(targetLevel, duration = .55) {
    const token = ++musicFadeToken;
    const from = backgroundMusic.volume;
    const target = Math.max(0, Math.min(1, targetLevel));
    const startedAt = performance.now();
    const durationMs = Math.max(1, duration * 1000);

    function step(now) {
      if (token !== musicFadeToken) return;

      const t = clamp((now - startedAt) / durationMs, 0, 1);
      const eased = t * t * (3 - 2 * t);
      setMusicLevel(lerp(from, target, eased));

      if (t < 1) requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
  }

  function beginFinaleMusicSync() {
    finaleMusicSyncStarted = true;
    finaleMusicSegmentStarted = true;

    // From this point forward, play only the final 17 seconds.
    musicFadeToken += 1;
    backgroundMusic.pause();
    backgroundMusic.loop = false;
    backgroundMusic.volume = 0;
    backgroundMusic.muted = !audioEnabled;

    const playFinalSeventeenSeconds = () => {
      const songDuration = backgroundMusic.duration;

      if (
        !Number.isFinite(songDuration) ||
        songDuration <= 0
      ) {
        return;
      }

      backgroundMusic.currentTime = Math.max(
        0,
        songDuration - 27
      );

      const playAttempt = backgroundMusic.play();
      if (
        playAttempt &&
        typeof playAttempt.catch === "function"
      ) {
        playAttempt.catch(() => {});
      }

      // A soft entrance prevents the seek from sounding abrupt.
      fadeMusicTo(normalMusicVolume * .92, .42);
    };

    if (
      Number.isFinite(backgroundMusic.duration) &&
      backgroundMusic.duration > 0
    ) {
      playFinalSeventeenSeconds();
    } else {
      backgroundMusic.addEventListener(
        "loadedmetadata",
        playFinalSeventeenSeconds,
        { once: true }
      );
    }
  }

  function cinematicSceneDuration(note) {

  function shouldDelayCinematicNote(note) {
    const musicTime = Number.isFinite(
      backgroundMusic.currentTime

      ? backgroundMusic.currentTime

    // The transition begins at 1:24. If the full note would
    // overlap it, wait. After sunrise reaches its destination, also
    // wait for the remaining bloom to settle completely.
    if (!daylightLocked) {
      const transitionStart = 84;
      const safetyMargin = .55;
      return (
        musicTime +
        cinematicSceneDuration(note) +
        safetyMargin >=
        transitionStart
      );
    }

    return sunriseFlash > .02;
  }

  function maybeStartCinematicNote(index) {
    const noteIndex = CONFIG.voiceNotes.findIndex(

    reachedVoiceNotes.add(index);

  function updateCinematicNote() {
    if (!activeCinematicNote) {
      endCinematicNote();
      return;
    }

    const typingDelay = .52;
    const text = activeCinematicNote.caption;
    const typingDuration = Math.max(
      .2,
      activeCinematicNote.typingDuration ||
      text.length / 20
    );

    if (
      !cinematicAudioStarted &&
      stateTime >= typingDelay
    ) {
      cinematicAudioStarted = true;

      if (activeCinematicAudio) {
        const playAttempt = activeCinematicAudio.play();

        if (
          playAttempt &&
          typeof playAttempt.catch === "function"
        ) {
          playAttempt.catch(() => {
            cinematicAudioFinished = true;
          });
        }
      } else {
        cinematicAudioFinished = true;
      }
    }

    const typingProgress = clamp(
      (stateTime - typingDelay) / typingDuration,
      0,
      1
    );
    const typedCount = Math.min(
      text.length,
      Math.floor(typingProgress * text.length)
    );

    while (cinematicTypedCharacters < typedCount) {
      appendCinematicCharacter(
        text[cinematicTypedCharacters]
      );
      cinematicTypedCharacters += 1;
    }

    const typingFinished =
      cinematicTypedCharacters >= text.length;
    cinematicText.classList.toggle(
      "typing",
      !typingFinished
    );

    const activeLength = Math.max(
      typingDuration,
      activeCinematicNote.audioDuration || 0
    );
    const earliestEnd =
      typingDelay + activeLength + 1.25;
    const audioReady =
      cinematicAudioFinished ||
      stateTime > earliestEnd + 3;

    if (
      typingFinished &&
      audioReady &&
      stateTime >= earliestEnd
    ) {
      endCinematicNote();
    }
  }

  function endCinematicNote() {
    if (activeCinematicAudio) {
      activeCinematicAudio.pause();
      activeCinematicAudio.currentTime = 0;
    }

    activeCinematicAudio = null;
    activeCinematicNote = null;
    cinematicAudioStarted = false;
    cinematicAudioFinished = true;
    cinematicTypedCharacters = 0;

    cinematicNoteOverlay.classList.remove("show");
    cinematicText.classList.remove("typing");
    document.body.classList.remove("cinematic-active");
    fadeMusicTo(normalMusicVolume, .72);

    state = "play";
    stateTime = 0;
    controls.classList.add("show");
  }

  function update(dt) {
    stateTime += dt;

    if (state === "cinematicNote") {
      updateCinematicNote();
      return;
    }

    player.bob += dt * 2.4;

    if (wrongShake > 0) wrongShake = Math.max(0, wrongShake - dt * 40);

    if (correctKeyFeedback) {
      correctKeyFeedback.age += dt;
      if (correctKeyFeedback.age >= correctKeyFeedback.duration) {
        correctKeyFeedback = null;
      }
    }

    if (wrongKeyFeedback) {
      wrongKeyFeedback.age += dt;
      if (wrongKeyFeedback.age >= wrongKeyFeedback.duration) {
        wrongKeyFeedback = null;
      }
    }

    // The scene begins changing at 1:24 and reaches full daylight at 1:29.
    // Once daylight arrives, it remains even if the song later loops.
    const musicTime = Number.isFinite(backgroundMusic.currentTime)
      ? backgroundMusic.currentTime
      : 0;

    if (!daylightLocked) {
      const targetDaylight = clamp((musicTime - 84) / 5, 0, 1);
      dayProgress = lerp(dayProgress, targetDaylight, Math.min(1, dt * 2.4));

      // Begin the bloom as soon as the sun starts becoming visible.
      if (dayProgress >= .075 && !sunriseFlashTriggered) {
        sunriseFlashTriggered = true;
        sunriseFlash = 0;
      }

      if (sunriseFlashTriggered) {
        sunriseFlash = smoothstep(
          clamp((dayProgress - .075) / .85, 0, 1)
        );
      }

      if (musicTime >= 89 || dayProgress > 0.995) {
        dayProgress = 1;
        daylightLocked = true;
        sunriseFlash = 1;
      }
    } else {
      dayProgress = 1;

      // Once the sun reaches its final position, let the bloom linger,
      // then fade over a little more than two seconds.
      if (sunriseFlash > 0) {
        sunriseFlash = Math.max(0, sunriseFlash - dt * .44);
      }
    }

    setUiPalette(dayProgress);

    if (state !== "title") {
      heartSpawnAccumulator += dt;
      const spawnInterval = lerp(0.72, 0.52, dayProgress);

      while (heartSpawnAccumulator >= spawnInterval) {
        heartSpawnAccumulator -= spawnInterval;
        spawnBackgroundHeart();
      }
    }

    backgroundHearts.forEach(heart => {
      heart.y += heart.speed * dt;
      heart.x += Math.sin(heart.phase + heart.y * 0.012) * heart.drift * dt;
      heart.rotation += heart.spin * dt;
      heart.phase += dt * 0.8;
    });
    backgroundHearts = backgroundHearts.filter(heart => heart.y < H + 70);

    if (state === "noteWait") {
      cameraTarget = Math.max(0, player.x - W * 0.34);

      if (
        waitingCinematicNote &&
        !shouldDelayCinematicNote(waitingCinematicNote)
      ) {
        startCinematicNote(waitingCinematicNote);
      }
    }

    else if (state === "title") {
      introBlack = 1;

      if (stateTime >= 1.40 && !introVoicePlayed) {
        introVoicePlayed = true;
        const introVoice = document.getElementById("introVoice");

        if (introVoice && audioEnabled) {
          setMusicLevel(normalMusicVolume);
          introVoice.currentTime = 0;
          introVoice.muted = false;
          introVoice.play().catch(() => {
            setMusicLevel(normalMusicVolume);
          });
        }
      }

      // Original text and title pacing, shifted so the title begins
      // appearing at exactly nine seconds.
      if (stateTime > 13.35) {
        state = "revealHer";
        stateTime = 0;
      }
    }

    else if (state === "revealHer") {
      introBlack = Math.max(0, 1 - stateTime / 2.1);
      cameraTarget = 0;

      if (stateTime > 1.15 && stateTime < 1.15 + dt) {
        showMessage("You're there baby, on one side.", 2600);
      }

      if (stateTime > 4.0) {
        state = "panToYou";
        stateTime = 0;
        showMessage("And between us, a massive distance...", 3500);
      }
    }

    else if (state === "panToYou") {
      const farCamera = Math.max(0, partner.x - W * 0.58);
      const panProgress = smootherstep(stateTime / 9.25);
      cameraTarget = lerp(0, farCamera, panProgress);

      if (stateTime > 5.15 && stateTime < 5.15 + dt) {
        showMessage("As the camera moves, farther and farther.", 3000);
      }

      if (stateTime > 9.25) {
        cameraTarget = farCamera;
        state = "lingerOnYou";
        stateTime = 0;
        showMessage("And here at the very end, I, am waiting for you.", 3300);
      }
    }

    else if (state === "lingerOnYou") {
      cameraTarget = partner.x - W * 0.58;

      if (stateTime > 3.5) {
        state = "panBack";
        stateTime = 0;
        showMessage("There is only one way forward.", 2500);
      }
    }

    else if (state === "panBack") {
      const farCamera = Math.max(0, partner.x - W * 0.58);
      const returnProgress = smootherstep(stateTime / 7.5);
      cameraTarget = lerp(farCamera, 0, returnProgress);

      if (stateTime > 4.75 && stateTime < 4.75 + dt) {
        showMessage("Let's close the distance, one jump at a time.", 2800);
      }

      if (stateTime > 7.5) {
        cameraTarget = 0;
        state = "play";
        stateTime = 0;
        controls.classList.add("show");
        showMessage("Press the key shown, my baby.", 3000);
      }
    }

    else if (state === "play") {
      cameraTarget = Math.max(0, player.x - W * 0.34);

      if (player.jumping) {
        player.jumpT = Math.min(1, player.jumpT + dt * 1.95);
        const t = player.jumpT;
        const eased = t * t * (3 - 2 * t);
        player.x = lerp(player.fromX, player.targetX, eased);
        player.y = lerp(player.fromY, player.targetY, eased) - Math.sin(Math.PI * t) * 115;

        if (t >= 1) completeJump();
      }
    }

    else if (state === "reunion") {
      const finalPlatformX = platforms[platforms.length - 1].x;
      cameraTarget = Math.max(0, finalPlatformX - W * 0.50);

      // Keep the pair balanced around the 150px-wide final platform.
      const meetX = finalPlatformX;
      player.x = lerp(player.x, meetX - 29, Math.min(1, dt * 2.2));
      partner.x = lerp(partner.x, meetX + 21, Math.min(1, dt * 2.2));

      if (stateTime > 0.72 && heartParticles.length < 85) {
        for (let i = 0; i < 4; i++) {
          spawnHeart(meetX, platformY(platforms.length - 1) - 72);
        }
      }

      if (stateTime > 2.65) {
        state = "heartFlood";
        stateTime = 0;
        transitionHearts = [];
        transitionSparkles = [];
        transitionSpawnAccumulator = 0;
        transitionBurstAccumulator = 0;
        endingCelebrationStage = 0;
        transitionWash = 0;
        spawnTransitionBurst(W * .5, H * .54, 38, 55, 220);
        spawnSparkleBurst(W * .5, H * .54, 34, 70, 230);
      }
    }

    else if (state === "heartFlood") {
      const finalPlatformX = platforms[platforms.length - 1].x;
      cameraTarget = Math.max(0, finalPlatformX - W * 0.50);

      // A shorter, lighter celebration that keeps the same staged rhythm.
      let heartsPerSecond = 0;
      let burstInterval = 999;

      if (stateTime < 2.54) {
        heartsPerSecond = stateTime < 1.20 ? 235 : 310;
        burstInterval = .98;
        transitionWash = clamp((stateTime - 1.02) / 2.40, 0, .30);
      } else if (stateTime < 9.19) {
        heartsPerSecond = 82;
        burstInterval = .98;
        transitionWash = .30 + Math.sin(stateTime * 1.7) * .020;
      } else if (stateTime < 11.88) {
        heartsPerSecond = 112;
        burstInterval = .74;
        transitionWash = clamp(
          .38 + (stateTime - 9.19) * .053,
          0,
          .56
        );
      } else {
        heartsPerSecond = 158;
        burstInterval = .56;
        transitionWash = clamp(
          .56 + (stateTime - 11.88) * .163,
          0,
          .95
        );
      }

      transitionSpawnAccumulator += dt * heartsPerSecond;
      transitionBurstAccumulator += dt;

      const availableSlots = Math.max(
        0,
        480 - transitionHearts.length
      );
      const spawnCount = Math.min(
        availableSlots,
        Math.floor(transitionSpawnAccumulator)
      );
      transitionSpawnAccumulator -= spawnCount;

      for (let i = 0; i < spawnCount; i++) {
        spawnTransitionHeart(stateTime);
      }

      while (transitionBurstAccumulator >= burstInterval) {
        transitionBurstAccumulator -= burstInterval;

        const burstX = W * (.24 + Math.random() * .52);
        const burstY = H * (.22 + Math.random() * .40);
        const earlyBurst = stateTime < 9.19;
        const burstCount = earlyBurst
          ? 18 + Math.floor(Math.random() * 11)
          : 24 + Math.floor(Math.random() * 15);

        spawnTransitionBurst(
          burstX,
          burstY,
          burstCount,
          earlyBurst ? 52 : 70,
          earlyBurst ? 225 : 300
        );
        spawnSparkleBurst(
          burstX,
          burstY,
          8 + Math.floor(Math.random() * 9),
          65,
          earlyBurst ? 220 : 305
        );
      }

      if (stateTime > 2.29 && endingCelebrationStage < 1) {
        endingCelebrationStage = 1;
        spawnTransitionBurst(W * .28, H * .46, 58, 70, 300);
        spawnTransitionBurst(W * .72, H * .46, 58, 70, 300);
        spawnSparkleBurst(W * .28, H * .46, 30, 90, 325);
        spawnSparkleBurst(W * .72, H * .46, 30, 90, 325);
      }

      if (stateTime > 3.73 && endingCelebrationStage < 2) {
        endingCelebrationStage = 2;
        spawnHeartRing(W * .5, H * .44, 95, 215);
        spawnSparkleBurst(W * .5, H * .44, 48, 100, 340);
      }

      if (stateTime > 5.80 && endingCelebrationStage < 3) {
        endingCelebrationStage = 3;
        spawnTransitionBurst(W * .18, H * .30, 48, 75, 315);
        spawnTransitionBurst(W * .50, H * .22, 62, 82, 345);
        spawnTransitionBurst(W * .82, H * .30, 48, 75, 315);
        spawnSparkleBurst(W * .5, H * .28, 60, 95, 370);
      }

      if (stateTime > 7.45 && endingCelebrationStage < 4) {
        endingCelebrationStage = 4;
        spawnHeartRing(W * .5, H * .53, 125, 285);
        spawnTransitionBurst(W * .5, H * .53, 82, 82, 390);
        spawnSparkleBurst(W * .5, H * .53, 72, 108, 420);
      }

      if (stateTime > 9.00 && endingCelebrationStage < 5) {
        endingCelebrationStage = 5;
        const finalePoints = [
          [W * .20, H * .42],
          [W * .40, H * .25],
          [W * .60, H * .25],
          [W * .80, H * .42],
          [W * .50, H * .52]
        ];

        finalePoints.forEach(([x, y], index) => {
          spawnTransitionBurst(
            x,
            y,
            index === 4 ? 92 : 48,
            88,
            395
          );
          spawnSparkleBurst(
            x,
            y,
            index === 4 ? 70 : 34,
            108,
            430
          );
        });
      }

      if (stateTime > 9.35) {
        finishFinaleMusicAtCard();
        state = "ending";
        stateTime = 0;
        endingText.textContent = CONFIG.endingMessage;
        ending.classList.add("show");
      }
    }

    cameraX = lerp(cameraX, cameraTarget, Math.min(1, dt * 3.15));

    heartParticles.forEach(p => {
      p.y += p.vy * dt;
      p.x += p.vx * dt;
      p.life -= dt;
      p.rotation += p.spin * dt;
    });
    heartParticles = heartParticles.filter(p => p.life > 0);

    transitionHearts.forEach(heart => {
      heart.x += heart.vx * dt;
      heart.y += heart.vy * dt;
      heart.rotation += heart.spin * dt;
      heart.scale += heart.growth * dt;
      heart.life -= dt;
    });
    transitionHearts = transitionHearts.filter(heart => heart.life > 0);

    transitionSparkles.forEach(sparkle => {
      sparkle.x += sparkle.vx * dt;
      sparkle.y += sparkle.vy * dt;
      sparkle.vy += sparkle.gravity * dt;
      sparkle.rotation += sparkle.spin * dt;
      sparkle.life -= dt;
    });
    transitionSparkles = transitionSparkles.filter(sparkle => sparkle.life > 0);
  }

  function spawnHeart(x, y) {
    const spriteOffset = dayProgress > .7 ? 4 : 0;
    const paletteLength = dayProgress > .7 ? 5 : 4;

    heartParticles.push({
      x: x + (Math.random() - .5) * 85,
      y: y + (Math.random() - .5) * 30,
      vx: (Math.random() - .5) * 45,
      vy: -45 - Math.random() * 80,
      size: 10 + Math.random() * 15,
      life: 1.2 + Math.random() * 1.2,
      rotation: Math.random() * Math.PI,
      spin: (Math.random() - .5) * 3,
      spriteIndex: spriteOffset + Math.floor(Math.random() * paletteLength)
    });
  }

  function spawnTransitionHeart(floodTime) {
    const fromSide = floodTime > 0.75 && Math.random() < 0.38;
    const side = Math.random() < .5 ? -1 : 1;

    let x;
    let y;
    let vx;
    let vy;

    if (fromSide) {
      x = side < 0 ? -50 : W + 50;
      y = Math.random() * H;
      vx = side < 0
        ? 150 + Math.random() * 250
        : -150 - Math.random() * 250;
      vy = -35 - Math.random() * 115;
    } else {
      x = Math.random() * W;
      y = H + 45 + Math.random() * 90;
      vx = (Math.random() - .5) * 170;
      vy = -180 - Math.random() * 340;
    }

    const paletteLength = dayProgress > .7 ? 5 : 4;
    const spriteOffset = dayProgress > .7 ? 4 : 0;

    transitionHearts.push({
      x,
      y,
      vx,
      vy,
      size: 14 + Math.random() * 42,
      scale: .72 + Math.random() * .72,
      growth: .08 + Math.random() * .24,
      life: 2.4 + Math.random() * 1.7,
      rotation: Math.random() * Math.PI * 2,
      spin: (Math.random() - .5) * 3,
      spriteIndex: spriteOffset + Math.floor(Math.random() * paletteLength),
      alpha: .56 + Math.random() * .42
    });
  }


  function spawnTransitionBurst(cx, cy, count, minSpeed, maxSpeed) {
    const available = Math.max(0, 480 - transitionHearts.length);
    const actualCount = Math.min(count, available);
    const paletteLength = dayProgress > .7 ? 5 : 4;
    const spriteOffset = dayProgress > .7 ? 4 : 0;

    for (let i = 0; i < actualCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = minSpeed + Math.random() * (maxSpeed - minSpeed);

      transitionHearts.push({
        x: cx + (Math.random() - .5) * 18,
        y: cy + (Math.random() - .5) * 18,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 28,
        size: 11 + Math.random() * 28,
        scale: .74 + Math.random() * .65,
        growth: .05 + Math.random() * .18,
        life: 2.0 + Math.random() * 1.45,
        rotation: Math.random() * Math.PI * 2,
        spin: (Math.random() - .5) * 3.7,
        spriteIndex: spriteOffset + Math.floor(Math.random() * paletteLength),
        alpha: .58 + Math.random() * .38
      });
    }
  }

  function spawnHeartRing(cx, cy, count, speed) {
    const available = Math.max(0, 480 - transitionHearts.length);
    const actualCount = Math.min(count, available);
    const paletteLength = dayProgress > .7 ? 5 : 4;
    const spriteOffset = dayProgress > .7 ? 4 : 0;

    for (let i = 0; i < actualCount; i++) {
      const angle = (Math.PI * 2 * i) / actualCount +
        (Math.random() - .5) * .055;
      const ringSpeed = speed * (.82 + Math.random() * .34);

      transitionHearts.push({
        x: cx + Math.cos(angle) * 7,
        y: cy + Math.sin(angle) * 7,
        vx: Math.cos(angle) * ringSpeed,
        vy: Math.sin(angle) * ringSpeed - 22,
        size: 12 + Math.random() * 25,
        scale: .78 + Math.random() * .5,
        growth: .05 + Math.random() * .14,
        life: 2.5 + Math.random() * 1.25,
        rotation: angle,
        spin: (Math.random() - .5) * 3.2,
        spriteIndex: spriteOffset + Math.floor(Math.random() * paletteLength),
        alpha: .64 + Math.random() * .32
      });
    }
  }

  function spawnSparkleBurst(cx, cy, count, minSpeed, maxSpeed) {
    const available = Math.max(0, 150 - transitionSparkles.length);
    const actualCount = Math.min(count, available);

    for (let i = 0; i < actualCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = minSpeed + Math.random() * (maxSpeed - minSpeed);

      transitionSparkles.push({
        x: cx + (Math.random() - .5) * 14,
        y: cy + (Math.random() - .5) * 14,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        gravity: 12 + Math.random() * 28,
        size: 2.4 + Math.random() * 6.6,
        life: 1.2 + Math.random() * 1.4,
        rotation: Math.random() * Math.PI,
        spin: (Math.random() - .5) * 5,
        color: (
          dayProgress > .7
            ? ["#ff7897", "#f39ab1", "#e48cae", "#f2ad8d", "#d982a4"]
            : ["#ff65aa", "#e27bbc", "#c987d2", "#f096be", "#b786d4"]
        )[Math.floor(Math.random() * 5)]
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    if (state === "title") {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);
      drawTitleScreen();
      return;
    }

    const shakeX = wrongShake > 0 ? (Math.random() - .5) * wrongShake : 0;
    const shakeY = wrongShake > 0 ? (Math.random() - .5) * wrongShake * .45 : 0;

    ctx.save();
    ctx.translate(shakeX, shakeY);

    drawSky(dayProgress);
    drawBackgroundHearts(dayProgress);
    drawWorld(dayProgress);

    ctx.restore();

    if (state === "heartFlood" || transitionHearts.length > 0) {
      drawTransitionHearts();
      drawTransitionSparkles();
    }

    if (sunriseFlash > 0) {
      const bloom = smoothstep(clamp(sunriseFlash, 0, 1));
      const sunRise = smootherstep(dayProgress);
      const bloomX = lerp(W * .72, W * .78, sunRise);
      const bloomY = lerp(H * .96, H * .17, sunRise);

      const flashGradient = ctx.createRadialGradient(
        bloomX,
        bloomY,
        0,
        bloomX,
        bloomY,
        Math.max(W, H) * .82
      );
      flashGradient.addColorStop(
        0,
        `rgba(255,255,255,${bloom * .70})`
      );
      flashGradient.addColorStop(
        .34,
        `rgba(255,252,247,${bloom * .38})`
      );
      flashGradient.addColorStop(
        .72,
        `rgba(255,244,235,${bloom * .13})`
      );
      flashGradient.addColorStop(
        1,
        "rgba(255,255,255,0)"
      );
      ctx.fillStyle = flashGradient;
      ctx.fillRect(0, 0, W, H);
    }

    if (transitionWash > 0) {
      const wash = ctx.createRadialGradient(
        W * .5, H * .55, 10,
        W * .5, H * .55, Math.max(W, H) * .72
      );
      wash.addColorStop(0, `rgba(255, 236, 244, ${transitionWash * .96})`);
      wash.addColorStop(.62, `rgba(255, 169, 199, ${transitionWash * .88})`);
      wash.addColorStop(1, `rgba(239, 111, 163, ${transitionWash * .82})`);
      ctx.fillStyle = wash;
      ctx.fillRect(0, 0, W, H);
    }

    if (introBlack > 0) {
      ctx.fillStyle = `rgba(0,0,0,${introBlack})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  function drawTitleScreen() {
    const t = stateTime;

    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const firstAlpha = fadeWindow(t, 1.40, 2.00, 3.50, 4.25);
    const secondAlpha = fadeWindow(t, 4.50, 5.10, 7.30, 8.10);
    const titleAlpha = fadeWindow(t, 9.00, 10.30, 12.40, 13.30);

    if (firstAlpha > 0) {
      ctx.globalAlpha = firstAlpha;
      ctx.fillStyle = "#f2dce8";
      ctx.font =
        `400 ${Math.min(34, W * .068)}px ` +
        `"Love Ya Like A Sister", cursive`;
      ctx.fillText(
        "No matter how far apart...",
        W / 2,
        H / 2
      );
    }

    if (secondAlpha > 0) {
      ctx.globalAlpha = secondAlpha;
      ctx.fillStyle = "#f6e8ef";
      ctx.font =
        `400 ${Math.min(34, W * .068)}px ` +
        `"Love Ya Like A Sister", cursive`;
      ctx.fillText(
        "Every step still brings us closer.",
        W / 2,
        H / 2
      );
    }

    if (titleAlpha > 0) {
      const centerX = W / 2;
      const centerY = H / 2;
      const pulse =
        1 + Math.sin((t - 9) * 2.25) * .012 * titleAlpha;
      const ornamentFloat =
        Math.sin((t - 9) * 1.35) * 2.5 * titleAlpha;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.scale(pulse, pulse);

      // Soft layered glow behind the entire title composition.
      const glow = ctx.createRadialGradient(
        0,
        0,
        0,
        0,
        0,
        Math.min(W * .42, 390)
      );
      glow.addColorStop(
        0,
        `rgba(222, 90, 153, ${titleAlpha * .19})`
      );
      glow.addColorStop(
        .48,
        `rgba(150, 57, 119, ${titleAlpha * .10})`
      );
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = titleAlpha;
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.ellipse(
        0,
        4,
        Math.min(W * .42, 390),
        Math.min(H * .25, 190),
        0,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Fit the script title cleanly within the screen.
      let titleSize = Math.min(88, Math.max(50, W * .105));
      ctx.font = `400 ${titleSize}px "Love Light", cursive`;
      const maxTitleWidth = Math.min(W - 56, 720);

      while (
        ctx.measureText(CONFIG.title).width > maxTitleWidth &&
        titleSize > 42
      ) {
        titleSize -= 2;
        ctx.font =
          `400 ${titleSize}px "Love Light", cursive`;
      }

      const measuredTitle =
        ctx.measureText(CONFIG.title).width;
      const ornamentWidth =
        Math.min(
          Math.max(measuredTitle * .58, 190),
          maxTitleWidth * .66
        );

      // Fine ornamental rules above and below.
      ctx.globalAlpha = titleAlpha * .70;
      ctx.strokeStyle = "rgba(255, 180, 214, .72)";
      ctx.lineWidth = 1.05;
      ctx.shadowColor = "rgba(255, 96, 171, .28)";
      ctx.shadowBlur = 8;

      [-1, 1].forEach(direction => {
        ctx.beginPath();
        ctx.moveTo(
          direction * 27,
          -titleSize * .63 + ornamentFloat
        );
        ctx.bezierCurveTo(
          direction * ornamentWidth * .22,
          -titleSize * .76 + ornamentFloat,
          direction * ornamentWidth * .72,
          -titleSize * .57 + ornamentFloat,
          direction * ornamentWidth,
          -titleSize * .68 + ornamentFloat
        );
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(
          direction * 34,
          titleSize * .57 - ornamentFloat
        );
        ctx.bezierCurveTo(
          direction * ornamentWidth * .28,
          titleSize * .72 - ornamentFloat,
          direction * ornamentWidth * .70,
          titleSize * .49 - ornamentFloat,
          direction * ornamentWidth,
          titleSize * .62 - ornamentFloat
        );
        ctx.stroke();
      });

      // Small decorative hearts at both sides.
      ctx.shadowBlur = 12;
      ctx.fillStyle = "rgba(255, 153, 201, .92)";
      ctx.font =
        `400 ${Math.max(18, titleSize * .25)}px ` +
        `"Love Ya Like A Sister", cursive`;
      ctx.globalAlpha = titleAlpha * .90;
      ctx.fillText(
        "♡",
        -ornamentWidth - 18,
        -titleSize * .03 + ornamentFloat
      );
      ctx.fillText(
        "♡",
        ornamentWidth + 18,
        -titleSize * .03 - ornamentFloat
      );

      // Sparkles and tiny hearts build a richer frame without clutter.
      const accents = [
        [-ornamentWidth * .72, -titleSize * .95, "✦", .84],
        [ornamentWidth * .74, -titleSize * .90, "✦", .72],
        [-ornamentWidth * .90, titleSize * .86, "·", .66],
        [ornamentWidth * .91, titleSize * .80, "·", .66],
        [-ornamentWidth * .38, titleSize * .88, "♡", .62],
        [ornamentWidth * .40, titleSize * .91, "♡", .62],
        [0, -titleSize * 1.04, "✦", .78]
      ];

      accents.forEach((accent, index) => {
        const [x, y, symbol, opacity] = accent;
        const twinkle =
          .76 +
          Math.sin(t * 3.1 + index * 1.47) * .24;
        ctx.globalAlpha =
          titleAlpha * opacity * twinkle;
        ctx.font =
          `400 ${Math.max(12, titleSize * .16)}px ` +
          `"Love Ya Like A Sister", cursive`;
        ctx.fillText(
          symbol,
          x,
          y + Math.sin(t * 1.45 + index) * 2
        );
      });

      // Main title: smaller, better balanced, and more readable.
      ctx.globalAlpha = titleAlpha;
      ctx.fillStyle = "#fff8fc";
      ctx.shadowColor = "rgba(255, 91, 169, .48)";
      ctx.shadowBlur = 24 * titleAlpha;
      ctx.font =
        `400 ${titleSize}px "Love Light", cursive`;
      ctx.fillText(CONFIG.title, 0, 0);

      // Subtle warm inner highlight.
      ctx.globalAlpha = titleAlpha * .32;
      ctx.fillStyle = "#ffd8ea";
      ctx.shadowBlur = 0;
      ctx.fillText(CONFIG.title, 0, -1.2);

      ctx.restore();
    }

    ctx.restore();
  }


  function drawSky(day) {
    const top = mixColor("#12091b", "#83c8e8", day);
    const middle = mixColor("#3b1637", "#efbed0", day);
    const bottom = mixColor("#a93472", "#f4d7b0", day);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, top);
    g.addColorStop(.58, middle);
    g.addColorStop(1, bottom);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    drawSkyLayers(day);

    if (day < 1) {
      const moonSet = smootherstep(day);
      const moonX = lerp(W * .80, W * .91, moonSet);
      const moonY = lerp(H * .18, H * .92, moonSet);
      const moonScale = lerp(1, .72, moonSet);

      ctx.save();
      ctx.globalAlpha = Math.pow(1 - day, 1.08);
      ctx.translate(moonX, moonY);
      ctx.scale(moonScale, moonScale);
      drawMoon(0, 0, Math.min(56, W * .09));
      ctx.restore();
    }

    if (day > 0) {
      const sunRise = smootherstep(day);
      const sunX = lerp(W * .72, W * .78, sunRise);
      const sunY = lerp(H * .96, H * .17, sunRise);
      const sunScale = lerp(.70, 1, sunRise);

      ctx.save();
      ctx.globalAlpha = Math.pow(day, .90);
      ctx.translate(sunX, sunY);
      ctx.scale(sunScale, sunScale);
      drawSun(0, 0, Math.min(58, W * .09));
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = day;
      drawClouds(day);
      drawBirds(day);
      drawButterflies(day);
      drawSkyWhimsy(day);
      ctx.restore();
    }

    const starAlpha = Math.pow(1 - day, 1.7);
    drawShootingStars(starAlpha);

    if (starAlpha > 0.01) {
      for (let i = 0; i < 88; i++) {
        const sx = ((i * 173 + i * i * 7 + 47) % (W + 180)) - 90;
        const sy =
          22 +
          ((i * 89 + i * i * 3 + 33) % Math.max(150, H * .55));
        const twinkle =
          .38 + Math.sin(performance.now() / (620 + i * 3) + i) * .30;
        ctx.globalAlpha = twinkle * starAlpha;
        ctx.fillStyle =
          i % 11 === 0 ? "#ffd1e7" :
          i % 7 === 0 ? "#e7d9ff" :
          "#fff8fc";
        ctx.beginPath();
        ctx.arc(sx, sy, i % 13 === 0 ? 2 : i % 5 === 0 ? 1.3 : .85, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.globalAlpha = 1;
  }

  function drawSkyLayers(day) {
    const night = 1 - day;
    const time = performance.now() * .00008;

    // Soft aurora ribbons at night.
    if (night > .02) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.globalAlpha = night * .075;

      const ribbons = [
        { y: .24, amp: 14, width: 34, a: "#a76ab6", b: "#df7eae", phase: 0 },
        { y: .39, amp: 10, width: 24, a: "#73589e", b: "#c982aa", phase: 3.1 }
      ];

      ribbons.forEach((ribbon, index) => {
        const gradient = ctx.createLinearGradient(0, 0, W, 0);
        gradient.addColorStop(0, "rgba(255,255,255,0)");
        gradient.addColorStop(.22, ribbon.a);
        gradient.addColorStop(.62, ribbon.b);
        gradient.addColorStop(1, "rgba(255,255,255,0)");

        ctx.strokeStyle = gradient;
        ctx.lineWidth = ribbon.width;
        ctx.lineCap = "round";
        ctx.beginPath();

        for (let x = -80; x <= W + 80; x += 35) {
          const y =
            H * ribbon.y +
            Math.sin(x * .006 + time * (8 + index * 2) + ribbon.phase) *
              ribbon.amp;
          if (x === -80) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      });

      ctx.restore();

      // Three quiet constellations make the upper sky feel intentional.
      const constellations = [
        // Simple heart constellation on the left.
        [
          [.112, .158],
          [.132, .126],
          [.157, .130],
          [.166, .150],
          [.175, .130],
          [.200, .126],
          [.220, .158],
          [.207, .204],
          [.166, .257],
          [.125, .204],
          [.112, .158]
        ],
        // Small upper-middle constellation, comfortably left of the moon.
        [[.48, .105], [.515, .145], [.555, .115], [.595, .158], [.635, .128]],
        // Lower-center constellation, separated from the heart.
        [[.34, .325], [.375, .285], [.415, .322], [.455, .282], [.485, .315]]
      ];

      ctx.save();
      ctx.globalAlpha = night * .29;
      ctx.strokeStyle = "#f3cfe2";
      ctx.fillStyle = "#fff3fa";
      ctx.lineWidth = 1;

      constellations.forEach((points, constellationIndex) => {
        ctx.save();

        if (constellationIndex === 0) {
          ctx.strokeStyle = "#ffd4e8";
          ctx.fillStyle = "#fff4fa";
          ctx.lineWidth = 1.25;
          ctx.shadowColor = "rgba(255, 163, 207, .38)";
          ctx.shadowBlur = 6;
        }

        ctx.beginPath();
        points.forEach(([px, py], index) => {
          const x = W * px;
          const y = H * py;
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        points.forEach(([px, py], index) => {
          if (constellationIndex === 0 && index === points.length - 1) {
            return;
          }

          ctx.beginPath();
          const radius = constellationIndex === 0
            ? (index === 8 ? 2.3 : 1.85)
            : (index % 2 ? 1.7 : 2.2);
          ctx.arc(W * px, H * py, radius, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      });
      ctx.restore();
    }

    // Daytime sunbeams and long, thin cloud streaks.
    if (day > .02) {
      ctx.save();
      ctx.globalAlpha = smoothstep((day - .18) / .82) * .16;

      const sunRise = smootherstep(day);
      const sunX = lerp(W * .72, W * .78, sunRise);
      const sunY = lerp(H * .96, H * .17, sunRise);
      const rayGradient = ctx.createRadialGradient(
        sunX,
        sunY,
        4,
        sunX,
        sunY,
        Math.max(W, H) * .72
      );
      rayGradient.addColorStop(0, "rgba(255,249,210,.76)");
      rayGradient.addColorStop(.38, "rgba(255,244,211,.25)");
      rayGradient.addColorStop(1, "rgba(255,241,218,0)");
      ctx.fillStyle = rayGradient;

      const rayTargets = [
        [.12, .73, .25, .73],
        [.30, .76, .41, .76],
        [.48, .78, .57, .78],
        [.64, .79, .72, .79],
        [.80, .80, .87, .80]
      ];

      rayTargets.forEach(([leftX, leftY, rightX, rightY]) => {
        ctx.beginPath();
        ctx.moveTo(sunX, sunY);
        ctx.lineTo(W * leftX, H * leftY);
        ctx.lineTo(W * rightX, H * rightY);
        ctx.closePath();
        ctx.fill();
      });

      ctx.globalAlpha = day * .24;
      ctx.strokeStyle = "#fff8f5";
      ctx.lineCap = "round";

      const wisps = [
        { x: .26, y: .13, width: 17, sway: 52, speed: .34, phase: .3 },
        { x: .42, y: .27, width: 12, sway: 44, speed: .27, phase: 2.1 },
        { x: .20, y: .41, width: 9, sway: 38, speed: .22, phase: 4.2 }
      ];

      wisps.forEach((wisp, index) => {
        const centerX =
          W * wisp.x +
          Math.sin(performance.now() * .001 * wisp.speed + wisp.phase) *
            wisp.sway;

        ctx.lineWidth = wisp.width;
        ctx.beginPath();
        ctx.moveTo(centerX - 150, H * wisp.y);
        ctx.bezierCurveTo(
          centerX - 58,
          H * wisp.y - 10 - index * 3,
          centerX + 48,
          H * wisp.y + 11,
          centerX + 155,
          H * wisp.y - 2
        );
        ctx.stroke();
      });

      ctx.restore();
    }
  }

  function drawSun(x, y, r) {
    const glow = ctx.createRadialGradient(x, y, r * .1, x, y, r * 2.1);
    glow.addColorStop(0, "rgba(255,252,214,.98)");
    glow.addColorStop(.38, "rgba(255,220,142,.58)");
    glow.addColorStop(1, "rgba(255,203,112,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, r * 2.1, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffe2a1";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawShootingStars(alpha) {
    if (alpha <= .02) return;

    const t = performance.now() * .00012;
    const stars = [
      { phase: .08, y: .18, length: 62, speed: .72 },
      { phase: .52, y: .31, length: 44, speed: .54 }
    ];

    ctx.save();
    ctx.lineCap = "round";

    stars.forEach((star, index) => {
      const cycle = (t * star.speed + star.phase) % 1;
      const x = W * (1.18 - cycle * 1.48);
      const y = H * star.y + cycle * H * .12;
      const tailX = x + star.length;
      const tailY = y - star.length * .42;

      const gradient = ctx.createLinearGradient(x, y, tailX, tailY);
      gradient.addColorStop(0, `rgba(255,246,252,${alpha * .9})`);
      gradient.addColorStop(1, "rgba(255,190,224,0)");

      ctx.strokeStyle = gradient;
      ctx.lineWidth = index === 0 ? 2 : 1.4;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();

      ctx.fillStyle = `rgba(255,250,253,${alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, index === 0 ? 2.3 : 1.7, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.restore();
  }

  function drawSkyWhimsy(day) {
    if (day <= .10) return;

    const time = performance.now() * .001;
    const visibility = smoothstep((day - .10) / .90);

    ctx.save();
    ctx.globalAlpha = visibility * .72;

    // A few extra tiny birds at different depths.
    const extraBirds = [
      { x: .13, y: .22, scale: .30, phase: .2 },
      { x: .39, y: .18, scale: .24, phase: 2.3 },
      { x: .62, y: .34, scale: .27, phase: 4.1 },
      { x: .88, y: .24, scale: .22, phase: 5.4 }
    ];

    extraBirds.forEach((bird, index) => {
      const travel =
        ((time * (7 + index * 1.1) +
          W * bird.x +
          index * 180) % (W + 180)) - 90;
      const y =
        H * bird.y +
        Math.sin(time * .75 + bird.phase) * 5;
      const flap =
        Math.sin(time * 4.2 + bird.phase) *
        2.4 *
        bird.scale;

      ctx.save();
      ctx.translate(travel, y);
      ctx.scale(bird.scale, bird.scale);
      ctx.strokeStyle = mixColor("#725069", "#8c6570", day);
      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(-9, -8 - flap, -19, -1);
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(9, -8 - flap, 19, -1);
      ctx.stroke();
      ctx.restore();
    });

    // Extra butterflies closer to the hills.
    for (let i = 0; i < 5; i++) {
      const x =
        ((time * (9 + i * 1.2) + i * 211 + 90) %
          (W + 100)) - 50;
      const y =
        H * (.42 + (i % 3) * .065) +
        Math.sin(time * (1.35 + i * .05) + i * 1.6) * 11;
      const flap =
        .42 + Math.abs(Math.sin(time * 5.8 + i * 1.3)) * .62;
      const size = 3.1 + (i % 2) * .9;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(time * .85 + i) * .16);
      ctx.fillStyle =
        i % 3 === 0
          ? mixColor("#cf75a8", "#ef91aa", day)
          : i % 3 === 1
            ? mixColor("#a780bb", "#d3afe2", day)
            : mixColor("#c79272", "#edc17e", day);

      ctx.beginPath();
      ctx.ellipse(
        -size * .52,
        0,
        size * flap,
        size * .52,
        -.45,
        0,
        Math.PI * 2
      );
      ctx.ellipse(
        size * .52,
        0,
        size * flap,
        size * .52,
        .45,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.fillStyle = mixColor("#663d5c", "#805064", day);
      ctx.fillRect(-.55, -size * .52, 1.1, size * 1.04);
      ctx.restore();
    }

    // Two tiny kites, drifting gently rather than crossing quickly.
    const kites = [
      {
        x: .21,
        y: .26,
        size: 8.5,
        phase: .4,
        colorA: "#c875a5",
        colorB: "#f0a0b4"
      },
      {
        x: .73,
        y: .38,
        size: 7.2,
        phase: 2.7,
        colorA: "#9b7eb7",
        colorB: "#d7b8e5"
      }
    ];

    kites.forEach((kite, index) => {
      const x =
        W * kite.x +
        Math.sin(time * .24 + kite.phase) * (15 + index * 4);
      const y =
        H * kite.y +
        Math.sin(time * .31 + kite.phase) * 8;
      const size = kite.size;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(time * .34 + kite.phase) * .10);

      ctx.fillStyle = mixColor(kite.colorA, kite.colorB, day);
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(size * .72, 0);
      ctx.lineTo(0, size);
      ctx.lineTo(-size * .72, 0);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = mixColor("#71506c", "#9a6a75", day);
      ctx.lineWidth = .9;
      ctx.beginPath();
      ctx.moveTo(0, -size);
      ctx.lineTo(0, size);
      ctx.moveTo(-size * .72, 0);
      ctx.lineTo(size * .72, 0);
      ctx.stroke();

      ctx.strokeStyle = mixColor("#85617a", "#b17c85", day);
      ctx.lineWidth = .85;
      ctx.beginPath();
      ctx.moveTo(0, size);
      ctx.bezierCurveTo(
        -4,
        size + 9,
        6,
        size + 16,
        -2,
        size + 25
      );
      ctx.stroke();

      ctx.fillStyle = mixColor("#c978a2", "#eda0aa", day);
      [-1, 1].forEach((direction, bowIndex) => {
        ctx.save();
        ctx.translate(
          direction * 2.5,
          size + 12 + bowIndex * 7
        );
        ctx.rotate(direction * .55);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(direction * 3.3, -2);
        ctx.lineTo(direction * 3.3, 2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      ctx.restore();
    });

    // Three small pastel balloons with trailing strings.
    const balloons = [
      { x: .10, y: .39, phase: .8, color: "#e68bac", scale: .82 },
      { x: .53, y: .23, phase: 3.1, color: "#d5a1d9", scale: .72 },
      { x: .91, y: .47, phase: 5.2, color: "#e9b58e", scale: .68 }
    ];

    balloons.forEach((balloon, index) => {
      const drift =
        ((time * (2.2 + index * .35) +
          W * balloon.x +
          index * 230) % (W + 100)) - 50;
      const y =
        H * balloon.y +
        Math.sin(time * .48 + balloon.phase) * 10;

      ctx.save();
      ctx.translate(drift, y);
      ctx.scale(balloon.scale, balloon.scale);

      ctx.fillStyle = balloon.color;
      ctx.globalAlpha = visibility * .72;
      ctx.beginPath();
      ctx.ellipse(0, 0, 7, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = visibility * .28;
      ctx.fillStyle = "#fff8fb";
      ctx.beginPath();
      ctx.ellipse(-2.2, -3, 1.5, 2.7, -.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = visibility * .65;
      ctx.fillStyle = mixColor("#7e526d", "#a66f7e", day);
      ctx.beginPath();
      ctx.moveTo(-2, 8);
      ctx.lineTo(2, 8);
      ctx.lineTo(0, 11);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = mixColor("#74506c", "#a2767d", day);
      ctx.lineWidth = .75;
      ctx.beginPath();
      ctx.moveTo(0, 11);
      ctx.bezierCurveTo(-3, 18, 4, 23, 0, 31);
      ctx.stroke();

      ctx.restore();
    });

    ctx.restore();
  }


  function drawBirds(day) {
    if (day <= .12) return;

    const time = performance.now() * .001;
    const flocks = [
      {
        y: .14,
        speed: 7.2,
        offset: 70,
        birds: [
          { dx: 0, dy: 0, scale: .48 },
          { dx: 68, dy: 13, scale: .42 },
          { dx: 143, dy: -5, scale: .37 }
        ]
      },
      {
        y: .29,
        speed: 4.8,
        offset: 520,
        birds: [
          { dx: 0, dy: 0, scale: .34 },
          { dx: 92, dy: -14, scale: .29 }
        ]
      }
    ];

    function drawDistantBird(x, y, scale, flapPhase) {
      const flap = Math.sin(time * 3.1 + flapPhase) * 2.2 * scale;

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.strokeStyle = "#76536a";
      ctx.fillStyle = "#76536a";
      ctx.lineWidth = 2.1;
      ctx.lineCap = "round";

      // Tiny body.
      ctx.beginPath();
      ctx.ellipse(0, 1, 4, 1.7, 0, 0, Math.PI * 2);
      ctx.fill();

      // Curved wings, separated by the body.
      ctx.beginPath();
      ctx.moveTo(-1.5, 0);
      ctx.quadraticCurveTo(-10, -9 - flap, -20, -2 + flap * .2);
      ctx.moveTo(1.5, 0);
      ctx.quadraticCurveTo(10, -9 - flap, 20, -2 + flap * .2);
      ctx.stroke();

      ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = day * .42;

    flocks.forEach((flock, flockIndex) => {
      const travel =
        ((time * flock.speed + flock.offset) % (W + 460)) - 230;
      const baseY = H * flock.y;

      flock.birds.forEach((bird, index) => {
        drawDistantBird(
          travel + bird.dx,
          baseY + bird.dy + Math.sin(time * .7 + index) * 2,
          bird.scale,
          flockIndex * 2 + index
        );
      });
    });

    ctx.restore();
  }

  function drawButterflies(day) {
    if (day <= .08) return;

    const time = performance.now() * .001;
    ctx.save();
    ctx.globalAlpha = day * .55;

    for (let i = 0; i < 7; i++) {
      const x =
        ((time * (12 + i * 1.7) + i * 173) % (W + 120)) - 60;
      const y =
        H * (.34 + (i % 3) * .08) +
        Math.sin(time * (1.2 + i * .07) + i) * 14;
      const flap = .45 + Math.abs(Math.sin(time * 5.4 + i)) * .7;
      const size = 3.8 + (i % 3) * 1.2;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(time * .8 + i) * .18);
      ctx.fillStyle = i % 2 === 0 ? "#f58eae" : "#ffd08f";

      ctx.beginPath();
      ctx.ellipse(-size * .55, 0, size * flap, size * .55, -.45, 0, Math.PI * 2);
      ctx.ellipse(size * .55, 0, size * flap, size * .55, .45, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#8b4b68";
      ctx.fillRect(-.7, -size * .55, 1.4, size * 1.1);
      ctx.restore();
    }

    ctx.restore();
  }

  function drawClouds(day) {
    if (day <= .02) return;

    const time = performance.now() * .001;
    const cloudSets = [
      {
        x: .05,
        y: .17,
        scale: 1.08,
        stretch: 1.28,
        drift: 11,
        speed: .11,
        phase: .4,
        blush: .30
      },
      {
        x: .28,
        y: .31,
        scale: .88,
        stretch: 1.34,
        drift: 15,
        speed: .095,
        phase: 1.8,
        blush: .23
      },
      {
        x: .49,
        y: .14,
        scale: .74,
        stretch: 1.30,
        drift: 11,
        speed: .082,
        phase: 3.2,
        blush: .20
      },
      {
        x: .71,
        y: .28,
        scale: .69,
        stretch: 1.38,
        drift: 10,
        speed: .074,
        phase: 4.5,
        blush: .18
      },
      {
        x: .91,
        y: .39,
        scale: .59,
        stretch: 1.32,
        drift: 8,
        speed: .066,
        phase: 5.7,
        blush: .16
      }
    ];

    function drawLayeredCloud(cloud, cloudIndex) {
      const sway =
        Math.sin(time * cloud.speed + cloud.phase) * cloud.drift;
      const bob =
        Math.sin(time * cloud.speed * .72 + cloud.phase * 1.3) * 2.2;

      ctx.save();
      ctx.translate(W * cloud.x + sway, H * cloud.y + bob);
      ctx.scale(cloud.scale * cloud.stretch, cloud.scale);

      // Diffused shadow under the cloud.
      ctx.globalAlpha = day * .17;
      ctx.fillStyle = mixColor("#b97ea5", "#d798aa", day);
      ctx.beginPath();
      ctx.ellipse(2, 25, 66, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      // Blush underside gives the clouds depth and keeps them in palette.
      const underside = ctx.createLinearGradient(0, -4, 0, 31);
      underside.addColorStop(
        0,
        `rgba(255, 236, 244, ${day * .12})`
      );
      underside.addColorStop(
        .58,
        `rgba(236, 166, 192, ${day * cloud.blush})`
      );
      underside.addColorStop(
        1,
        `rgba(208, 132, 166, ${day * cloud.blush * .78})`
      );
      ctx.globalAlpha = 1;
      ctx.fillStyle = underside;
      ctx.beginPath();
      ctx.arc(-40, 7, 23, 0, Math.PI * 2);
      ctx.arc(-15, -7, 31, 0, Math.PI * 2);
      ctx.arc(18, -12, 36, 0, Math.PI * 2);
      ctx.arc(48, 4, 25, 0, Math.PI * 2);
      roundRect(ctx, -68, 5, 136, 29, 14);
      ctx.fill();

      // Cream-white upper puffs.
      const topLight = ctx.createLinearGradient(0, -42, 0, 20);
      topLight.addColorStop(
        0,
        `rgba(255, 252, 248, ${day * .88})`
      );
      topLight.addColorStop(
        .58,
        `rgba(255, 243, 244, ${day * .76})`
      );
      topLight.addColorStop(
        1,
        `rgba(244, 207, 220, ${day * .42})`
      );
      ctx.fillStyle = topLight;

      [
        [-42, 2, 19],
        [-20, -11, 27],
        [8, -17, 32],
        [35, -7, 25],
        [52, 7, 17]
      ].forEach(([x, y, r]) => {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Soft highlight along the cloud's top edge.
      ctx.globalAlpha = day * .36;
      ctx.strokeStyle = "#fffdf9";
      ctx.lineWidth = 2.1;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-42, -5);
      ctx.quadraticCurveTo(-20, -30, 3, -32);
      ctx.quadraticCurveTo(29, -29, 44, -9);
      ctx.stroke();

      // A few subtle hanging wisps on the larger left clouds.
      if (cloudIndex < 2) {
        ctx.globalAlpha = day * .19;
        ctx.strokeStyle = mixColor("#f3cadc", "#f2d4d0", day);
        ctx.lineWidth = 4.5;
        ctx.lineCap = "round";

        [-28, 5, 35].forEach((x, wispIndex) => {
          ctx.beginPath();
          ctx.moveTo(x, 24);
          ctx.bezierCurveTo(
            x - 6,
            31 + wispIndex * 2,
            x + 5,
            37 + wispIndex,
            x - 2,
            44 + wispIndex * 2
          );
          ctx.stroke();
        });
      }

      // Tiny pearly glints keep the clouds whimsical without clutter.
      if (cloudIndex !== 3) {
        ctx.globalAlpha = day * .34;
        ctx.fillStyle = cloudIndex % 2 === 0 ? "#ffe0ee" : "#fff0d7";

        [
          [-59, -5, 1.8],
          [57, -11, 1.4],
          [21, -42, 1.6]
        ].forEach(([x, y, size], glintIndex) => {
          const pulse =
            .7 + Math.sin(time * 1.7 + cloudIndex + glintIndex) * .25;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(Math.PI / 4);
          ctx.fillRect(
            -size * pulse,
            -size * pulse,
            size * 2 * pulse,
            size * 2 * pulse
          );
          ctx.restore();
        });
      }

      ctx.restore();
    }

    cloudSets.forEach(drawLayeredCloud);
    ctx.globalAlpha = 1;
  }

  function drawMoon(x, y, r) {
    const g = ctx.createRadialGradient(x, y, r * .1, x, y, r * 1.8);
    g.addColorStop(0, "rgba(255,244,250,.95)");
    g.addColorStop(.35, "rgba(255,218,238,.55)");
    g.addColorStop(1, "rgba(255,150,200,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r * 1.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff0f7";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawWorld(day) {
    const waterY = H * waterYRatio;

    drawFarShore(waterY, day);

    ctx.save();
    ctx.translate(-cameraX, 0);

    drawWater(waterY, day);

    // Only render platforms near the camera. Drawing all 100 detailed
    // stones every frame was the largest source of slowdown.
    const platformPadding = 300;
    const firstVisiblePlatform = clamp(
      Math.floor(
        (cameraX - platformPadding - 160) / platformSpacing
      ),
      0,
      platforms.length - 1
    );
    const lastVisiblePlatform = clamp(
      Math.ceil(
        (cameraX + W + platformPadding - 160) / platformSpacing
      ),
      0,
      platforms.length - 1
    );

    for (
      let i = firstVisiblePlatform;
      i <= lastVisiblePlatform;
      i++
    ) {
      drawPlatform(i, platformY(i), day);
    }

    if (
      state === "play" &&
      player.platform < platforms.length - 1
    ) {
      const promptIndex = player.platform + 1;
      const showingSuccessEffect =
        correctKeyFeedback &&
        correctKeyFeedback.index === promptIndex;

      if (!player.jumping || showingSuccessEffect) {
        drawKeyPrompt(
          promptIndex,
          platformY(promptIndex),
          day
        );
      }
    }

    player.y = player.jumping ? player.y : platformY(player.platform);
    partner.y = platformY(platforms.length - 1);

    const herShirt = mixColor("#ff8fc4", "#ff9fbd", day);
    const herHair = mixColor("#6c315c", "#7d4365", day);
    const yourShirt = mixColor("#9ec5ff", "#8ecff3", day);
    const yourHair = mixColor("#25486e", "#315f7a", day);

    drawCharacter(partner.x, partner.y, CONFIG.yourName, yourShirt, yourHair, partner.facing, false, day);
    drawCharacter(player.x, player.y, CONFIG.herName, herShirt, herHair, player.facing, true, day);
    drawReunionHeart(day);

    heartParticles.forEach(particle => drawHeartParticle(particle, day));

    ctx.restore();
  }

  function drawFarShore(waterY, day) {

    ctx.globalAlpha = lerp(.72, .62, day);
    ctx.beginPath();

    ctx.beginPath();
    ctx.moveTo(0, waterY);
    ctx.lineTo(0, waterY - 52);
    ctx.bezierCurveTo(
      W * .12,
      waterY - 104,
      W * .25,
      waterY - 89,
      W * .34,
      waterY - 44
    );
    ctx.bezierCurveTo(
      W * .48,
      waterY - 121,
      W * .62,

      W * .72,

    );
    ctx.bezierCurveTo(
      W * .84,

    // Highlighted hill ridges.
    ctx.globalAlpha = lerp(.13, .29, day);

    ctx.lineWidth = 2.1;
    ctx.beginPath();

      W * .14,

    ctx.moveTo(W * .48, waterY - 83);

    ctx.stroke();

    drawHillFlowerFields(waterY, day, time, "front");

    // Cute volcano positioned center-left to balance the sun.
    drawCuteVolcano(W * .245, waterY - 4, 1.17, day, time);

    // Tiny bushes and flowering shrubs across the lower ridge.
    const shrubs = [
      [.05, 13, .72],

    shrubs.forEach(([xRatio, radius, scale], shrubIndex) => {

      ctx.globalAlpha = lerp(.18, .68, day);
      ctx.fillStyle =
        shrubIndex % 3 === 0 ? "#ffc1d6" :

      [-8, 4, 12].forEach((dx, flowerIndex) => {

    // Small winding path on the right hill.
    ctx.save();
    ctx.globalAlpha = lerp(.10, .35, day);
    ctx.strokeStyle = mixColor("#b77f9b", "#efd0ba", day);
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(W * .72, waterY - 45);
    ctx.bezierCurveTo(
      W * .77,
      waterY - 59,
      W * .82,
      waterY - 44,
      W * .87,
      waterY - 62
    );
    ctx.bezierCurveTo(
      W * .91,
      waterY - 76,
      W * .94,
      waterY - 65,
