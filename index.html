    );
    ctx.stroke();
    ctx.restore();

    // Occasional hill fireflies at night.
    if (night > .05) {
      ctx.save();
      ctx.globalAlpha = night * .42;
      ctx.fillStyle = "#ffd5e8";

      for (let i = 0; i < 14; i++) {
        const x =
          ((i * 137 + 53) % Math.max(1, W - 30)) + 15;
        const y =
          waterY -
          26 -
          ((i * 43) % 74) +
          Math.sin(time * 1.2 + i) * 3;
        const pulse = .6 + Math.sin(time * 2 + i) * .34;

        ctx.beginPath();
        ctx.arc(x, y, 1.2 + pulse * .7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.globalAlpha = 1;
  }

  function cubicBezierValue(a, b, c, d, t) {
    const inv = 1 - t;
    return (
      inv * inv * inv * a +
      3 * inv * inv * t * b +
      3 * inv * t * t * c +
      t * t * t * d
    );
  }

  function hillCurveYAtX(x, points) {
    let low = 0;
    let high = 1;

    for (let iteration = 0; iteration < 12; iteration++) {
      const mid = (low + high) / 2;
      const curveX = cubicBezierValue(
        points[0][0],
        points[1][0],
        points[2][0],
        points[3][0],
        mid
      );

      if (curveX < x) low = mid;
      else high = mid;
    }

    const t = (low + high) / 2;
    return cubicBezierValue(
      points[0][1],
      points[1][1],
      points[2][1],
      points[3][1],
      t
    );
  }

  function hillSurfaceYAtX(x, waterY, isBack) {
    if (isBack) {
      if (x <= W * .27) {
        return hillCurveYAtX(x, [
          [0, waterY - 89],
          [W * .09, waterY - 172],
          [W * .19, waterY - 119],
          [W * .27, waterY - 82]
        ]);
      }

      if (x <= W * .58) {
        return hillCurveYAtX(x, [
          [W * .27, waterY - 82],
          [W * .38, waterY - 171],
          [W * .50, waterY - 154],
          [W * .58, waterY - 89]
        ]);
      }

      return hillCurveYAtX(x, [
        [W * .58, waterY - 89],
        [W * .70, waterY - 172],
        [W * .82, waterY - 138],
        [W, waterY - 83]
      ]);
    }

    if (x <= W * .34) {
      return hillCurveYAtX(x, [
        [0, waterY - 52],
        [W * .12, waterY - 104],
        [W * .25, waterY - 89],
        [W * .34, waterY - 44]
      ]);
    }

    if (x <= W * .72) {
      return hillCurveYAtX(x, [
        [W * .34, waterY - 44],
        [W * .48, waterY - 121],
        [W * .62, waterY - 109],
        [W * .72, waterY - 45]
      ]);
    }

    return hillCurveYAtX(x, [
      [W * .72, waterY - 45],
      [W * .84, waterY - 101],
      [W * .92, waterY - 84],
      [W, waterY - 49]
    ]);
  }

  function rebuildFlowerLayouts() {
    const waterY = H * waterYRatio;

    ["back", "front"].forEach(depth => {
      const isBack = depth === "back";
      const count = isBack ? 30 : 48;
      const usableWidth = Math.max(60, W - 30);
      const spacing = usableWidth / count;
      const layout = [];

      for (let i = 0; i < count; i++) {
        const x =
          15 +
          spacing * (i + .5) +
          Math.sin(i * 2.17) * spacing * .20;
        const surfaceY = hillSurfaceYAtX(x, waterY, isBack);
        const stemHeight =
          (isBack ? 5 : 9) +
          ((i * 5) % (isBack ? 4 : 7));

        layout.push({
          x,
          surfaceY,
          flowerY: surfaceY - stemHeight,
          stemHeight,
          size:
            (isBack ? 1.55 : 2.65) +
            (i % 3) * (isBack ? .14 : .22),
          paletteIndex: (i * 3 + (isBack ? 1 : 0)) % 4
        });
      }

      flowerLayouts[depth] = layout;
    });
  }

  function drawHillFlowerFields(
    waterY,
    day,
    time,
    depth
  ) {
    const isBack = depth === "back";
    const flowers = flowerLayouts[depth];
    if (!flowers.length) return;

    const visibility = isBack
      ? lerp(.26, .64, day)
      : lerp(.46, .94, day);
    const stemColor = isBack
      ? mixColor("#493451", "#819078", day)
      : mixColor("#402f49", "#718a6b", day);
    const flowerPalette = [
      mixColor("#a96a92", "#ee9db4", day),
      mixColor("#9273aa", "#d7b5e2", day),
      mixColor("#ad846c", "#ebbd82", day),
      mixColor("#a6617e", "#e98f9a", day)
    ];
    const centerColor = mixColor("#c993b6", "#ffe0a7", day);

    ctx.save();
    ctx.lineCap = "round";

    // Simple straight stems, all anchored exactly on the hill.
    ctx.globalAlpha = visibility * .84;
    ctx.strokeStyle = stemColor;
    ctx.lineWidth = isBack ? .75 : 1.15;
    ctx.beginPath();
    flowers.forEach(flower => {
      ctx.moveTo(flower.x, flower.surfaceY + .5);
      ctx.lineTo(flower.x, flower.flowerY);
    });
    ctx.stroke();

    // Simple round flower heads grouped by palette.
    flowerPalette.forEach((color, paletteIndex) => {
      ctx.globalAlpha = visibility;
      ctx.fillStyle = color;
      ctx.beginPath();

      flowers.forEach(flower => {
        if (flower.paletteIndex !== paletteIndex) return;
        ctx.moveTo(flower.x + flower.size, flower.flowerY);
        ctx.arc(
          flower.x,
          flower.flowerY,
          flower.size,
          0,
          Math.PI * 2
        );
      });

      ctx.fill();
    });

    // Small centers make them read clearly as flowers.
    ctx.globalAlpha = visibility * .88;
    ctx.fillStyle = centerColor;
    ctx.beginPath();
    flowers.forEach(flower => {
      const centerSize = flower.size * .38;
      ctx.moveTo(flower.x + centerSize, flower.flowerY);
      ctx.arc(
        flower.x,
        flower.flowerY,
        centerSize,
        0,
        Math.PI * 2
      );
    });
    ctx.fill();

    ctx.restore();
  }


  function drawCuteVolcano(x, baseY, scale, day, time) {
    ctx.save();
    ctx.translate(x, baseY);
    ctx.scale(scale, scale);

    const transitionShock =
      smoothstep(clamp((day - .18) / .44, 0, 1)) *
      (1 - smoothstep(clamp((day - .70) / .20, 0, 1)));
    const daytimeHappy = smoothstep(clamp((day - .58) / .34, 0, 1));
    const nightCalm = 1 - smoothstep(clamp(day / .30, 0, 1));

    // Softer, more natural volcano silhouette with broad rounded shoulders
    // and a narrower summit.
    const volcanoGradient = ctx.createLinearGradient(0, -174, 0, 2);
    volcanoGradient.addColorStop(
      0,
      mixColor("#66345f", "#bf738f", day)
    );
    volcanoGradient.addColorStop(
      .42,
      mixColor("#764068", "#cf8198", day)
    );
    volcanoGradient.addColorStop(
      .76,
      mixColor("#7d486e", "#cf879e", day)
    );
    volcanoGradient.addColorStop(
      1,
      mixColor("#79456a", "#cb849b", day)
    );

    ctx.fillStyle = volcanoGradient;
    ctx.beginPath();
    ctx.moveTo(-122, 0);
    ctx.bezierCurveTo(-104, -37, -91, -73, -67, -105);
    ctx.bezierCurveTo(-50, -129, -39, -150, -27, -163);
    ctx.bezierCurveTo(-17, -174, -8, -168, 0, -166);
    ctx.bezierCurveTo(9, -170, 18, -174, 29, -162);
    ctx.bezierCurveTo(43, -147, 54, -126, 70, -101);
    ctx.bezierCurveTo(94, -65, 108, -31, 124, 0);
    ctx.closePath();
    ctx.fill();

    // No separate underside overlay: the base remains within the
    // same rose-purple body palette.

    // Decorative rock contours stay on the outer slopes and never cross
    // the face area.
    ctx.save();
    ctx.globalAlpha = lerp(.23, .34, day);
    ctx.strokeStyle = mixColor("#a75e89", "#dfa0ab", day);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";

    const sideContours = [
      [-94, -34, -78, -59, -62, -86],
      [-81, -21, -64, -38, -48, -47],
      [-58, -103, -49, -125, -36, -143],
      [40, -143, 51, -125, 60, -104],
      [65, -87, 82, -61, 98, -34],
      [51, -48, 72, -39, 91, -20]
    ];

    sideContours.forEach(([x1, y1, cx, cy, x2, y2]) => {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(cx, cy, x2, y2);
      ctx.stroke();
    });
    ctx.restore();

    // Small scattered rock facets on the lower slopes.
    ctx.save();
    ctx.globalAlpha = lerp(.16, .25, day);
    ctx.fillStyle = mixColor("#b27694", "#e0a7b2", day);
    [
      [-82, -14, 8, 4, -.2],
      [-62, -67, 6, 3, .22],
      [72, -16, 9, 4, .15],
      [83, -54, 6, 3, -.18]
    ].forEach(([fx, fy, rx, ry, rot]) => {
      ctx.beginPath();
      ctx.ellipse(fx, fy, rx, ry, rot, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();

    // Compact crater fitted cleanly inside the summit.
    const craterGradient = ctx.createLinearGradient(0, -174, 0, -154);
    craterGradient.addColorStop(
      0,
      mixColor("#4a2444", "#8b5169", day)
    );
    craterGradient.addColorStop(
      1,
      mixColor("#321b36", "#704057", day)
    );

    ctx.fillStyle = craterGradient;
    ctx.beginPath();
    ctx.ellipse(1, -164, 25, 6.8, -.02, 0, Math.PI * 2);
    ctx.fill();

    // Front rim follows the summit instead of floating above it.
    ctx.globalAlpha = lerp(.48, .64, day);
    ctx.strokeStyle = mixColor("#94527a", "#d78c9c", day);
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.ellipse(1, -163, 26, 7.3, -.02, 0, Math.PI);
    ctx.stroke();

    ctx.globalAlpha = lerp(.27, .40, day);
    ctx.strokeStyle = mixColor("#c2749b", "#eeabb0", day);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(1, -166, 19, 3.7, -.02, Math.PI, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Seamless steam: each puff disappears fully before recycling.
    const steamBaseAlpha = lerp(.18, .50, day);
    const steamColor = mixColor("#b98bb4", "#ffe1d5", day);
    ctx.fillStyle = steamColor;

    for (let i = 0; i < 5; i++) {
      const cycle = (time * .105 + i * .19) % 1;
      const fade = Math.sin(Math.PI * cycle);
      const puffX =
        -12 +
        i * 6 +
        Math.sin(time * .55 + i * 1.7) * (4.5 + i * .35);
      const puffY = -181 - cycle * 77;
      const radius = 6.5 + cycle * 7.5 + (i % 2) * 1.3;

      ctx.globalAlpha = steamBaseAlpha * fade;
      ctx.beginPath();
      ctx.arc(puffX, puffY, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = steamBaseAlpha * fade * .54;
      ctx.beginPath();
      ctx.arc(
        puffX + radius * .55,
        puffY + 1.5,
        radius * .68,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Face grooves are only slightly darker than the body.
    const faceY = -82;
    const faceColor = mixColor("#592c50", "#a9617c", day);

    ctx.save();
    ctx.globalAlpha = .84;
    ctx.strokeStyle = faceColor;
    ctx.fillStyle = faceColor;
    ctx.lineWidth = 4.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (transitionShock > .12) {
      // Sunrise: open round eyes and a pronounced O mouth.
      const eyeRadius = lerp(3.5, 6.5, transitionShock);
      [-23, 23].forEach(eyeX => {
        ctx.beginPath();
        ctx.arc(eyeX, faceY - 5, eyeRadius, 0, Math.PI * 2);
        ctx.stroke();
      });

      const mouthRadius = lerp(6, 11, transitionShock);
      ctx.beginPath();
      ctx.ellipse(
        0,
        faceY + 25,
        mouthRadius * .72,
        mouthRadius,
        0,
        0,
        Math.PI * 2
      );
      ctx.stroke();
    } else if (daytimeHappy > .15) {
      // Day: high happy crescent eyes and a large open grin.
      [-24, 24].forEach(eyeX => {
        ctx.beginPath();
        ctx.arc(
          eyeX,
          faceY - 4,
          9,
          .10 * Math.PI,
          .90 * Math.PI
        );
        ctx.stroke();
      });

      ctx.beginPath();
      ctx.moveTo(-23, faceY + 17);
      ctx.quadraticCurveTo(0, faceY + 39, 23, faceY + 17);
      ctx.quadraticCurveTo(0, faceY + 31, -23, faceY + 17);
      ctx.closePath();
      ctx.stroke();

      // Small carved cheek marks make daytime clearly happier.
      ctx.globalAlpha = daytimeHappy * .36;
      ctx.lineWidth = 3;
      [-38, 38].forEach(cheekX => {
        ctx.beginPath();
        ctx.moveTo(cheekX - 5, faceY + 13);
        ctx.lineTo(cheekX + 5, faceY + 11);
        ctx.stroke();
      });
      ctx.globalAlpha = .84;
    } else {
      // Night: drooping sleepy eyelids and a tiny neutral mouth.
      [-23, 23].forEach(eyeX => {
        ctx.beginPath();
        ctx.moveTo(eyeX - 8, faceY - 1);
        ctx.quadraticCurveTo(
          eyeX,
          faceY + 5 + nightCalm * 2,
          eyeX + 8,
          faceY - 1
        );
        ctx.stroke();
      });

      ctx.lineWidth = 3.6;
      ctx.beginPath();
      ctx.moveTo(-7, faceY + 24);
      ctx.quadraticCurveTo(0, faceY + 21, 7, faceY + 24);
      ctx.stroke();
    }

    ctx.restore();

    // Tiny flowers at the volcano base during daytime.
    if (day > .25) {
      ctx.globalAlpha = day * .72;
      [
        [-76, -6, "#ffc0d4"],
        [-51, -10, "#ffe0a4"],
        [58, -8, "#e5c2ef"],
        [81, -4, "#ffb8ca"]
      ].forEach(([flowerX, flowerY, color]) => {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(flowerX, flowerY, 3.2, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  function drawWater(waterY, day) {
    const time = performance.now() * .001;
    const waterGradient = ctx.createLinearGradient(0, waterY, 0, H);

    waterGradient.addColorStop(0, mixColor("#ff70af", "#ffacd0", day));
    waterGradient.addColorStop(.22, mixColor("#e45297", "#f08db8", day));
    waterGradient.addColorStop(.58, mixColor("#a3367f", "#cf6fa8", day));
    waterGradient.addColorStop(1, mixColor("#651c59", "#9d5a8c", day));

    ctx.fillStyle = waterGradient;
    ctx.fillRect(cameraX, waterY, W + 120, H - waterY + 4);

    const horizonGlow = ctx.createLinearGradient(0, waterY, 0, waterY + 88);
    horizonGlow.addColorStop(0, `rgba(255, 241, 246, ${lerp(.12, .44, day)})`);
    horizonGlow.addColorStop(.6, `rgba(255, 231, 241, ${lerp(.06, .18, day)})`);
    horizonGlow.addColorStop(1, "rgba(255, 235, 244, 0)");
    ctx.fillStyle = horizonGlow;
    ctx.fillRect(cameraX, waterY, W + 120, 92);

    for (let row = 0; row < 10; row++) {
      const depth = row / 9;
      const y = waterY + 10 + row * 27;
      const alpha = lerp(.18, .5, day) * (1 - depth * .30);
      const amplitude = 2.6 + depth * 4.2;
      const spacing = 16 + depth * 6;

      ctx.beginPath();
      for (let x = cameraX - 90; x < cameraX + W + 140; x += spacing) {
        const wave =
          Math.sin(x * .027 + time * (1.1 + depth) + row * .77) * amplitude;
        const secondWave =
          Math.sin(x * .012 - time * .72 + row * 1.2) * amplitude * .34;
        const pointY = y + wave + secondWave;

        if (x === cameraX - 90) ctx.moveTo(x, pointY);
        else ctx.lineTo(x, pointY);
      }

      ctx.strokeStyle = `rgba(255, 247, 251, ${alpha})`;
      ctx.lineWidth = lerp(1.2, 2.25, day);
      ctx.stroke();
    }

    function drawCoralPatch(x, y, scale, toneShift) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.globalAlpha = lerp(.16, .68, day);

      ctx.strokeStyle = toneShift === 0
        ? mixColor("#69405f", "#ffcfb7", day)
        : mixColor("#573859", "#f0b781", day);
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 6, 0);
        ctx.quadraticCurveTo(
          i * 10,
          -16 - Math.abs(i) * 4,
          i * 4,
          -34 - Math.abs(i) * 7
        );
        ctx.stroke();
      }

      ctx.strokeStyle = toneShift === 0
        ? mixColor("#744364", "#ffb9a6", day)
        : mixColor("#60375b", "#ef9a79", day);
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-20, 0);
      ctx.quadraticCurveTo(-26, -20, -14, -34);
      ctx.moveTo(-12, -8);
      ctx.quadraticCurveTo(-4, -26, 4, -42);
      ctx.moveTo(6, -2);
      ctx.quadraticCurveTo(18, -20, 14, -40);
      ctx.moveTo(18, -6);
      ctx.quadraticCurveTo(28, -18, 32, -30);
      ctx.stroke();

      ctx.fillStyle = mixColor("#80516f", "#ffe7cb", day);
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(-16 + i * 15, 5, 5 + i, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    const clusterStart = Math.floor((cameraX - 120) / 360) * 360;
    for (let x = clusterStart; x < cameraX + W + 160; x += 360) {
      const y = H - 16 - (Math.sin(x * .01) > 0 ? 0 : 12);
      const scale = .78 + Math.abs(Math.sin(x * .017)) * .45;
      drawCoralPatch(x + 58, y, scale, x % 720 === 0 ? 0 : 1);
    }

    function drawFish(x, y, size, dir, colorA, colorB) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(dir, 1);
      ctx.globalAlpha = lerp(.22, .86, day);

      const body = ctx.createLinearGradient(-size, 0, size, 0);
      body.addColorStop(0, colorA);
      body.addColorStop(1, colorB);

      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 1.2, size * .6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-size * 1.2, 0);
      ctx.lineTo(-size * 2.0, -size * .7);
      ctx.lineTo(-size * 2.0, size * .7);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = `rgba(255,255,255,${lerp(.06, .46, day)})`;
      ctx.beginPath();
      ctx.ellipse(size * .2, -size * .15, size * .5, size * .16, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = mixColor("#2f2038", "#6f3257", day);
      ctx.beginPath();
      ctx.arc(size * .65, -size * .08, Math.max(1.2, size * .09), 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    for (let i = 0; i < 7; i++) {
      const dir = i % 2 === 0 ? 1 : -1;
      const swim = time * (20 + i * 3) * dir * 1.9;
      const loopWidth = W + 320;
      const baseX =
        cameraX - 100 +
        ((i * 187 + swim) % loopWidth + loopWidth) % loopWidth;
      const baseY =
        waterY +
        78 +
        ((i * 41) % Math.max(70, H - waterY - 120)) +
        Math.sin(time * 1.3 + i) * 9;
      const size = 7 + (i % 3) * 2.5;
      const colorA = i % 2 === 0
        ? mixColor("#72506e", "#ffe7c0", day)
        : mixColor("#634663", "#ffb1a7", day);
      const colorB = i % 2 === 0
        ? mixColor("#563b5d", "#efac84", day)
        : mixColor("#4c3557", "#d8867f", day);
      drawFish(baseX, baseY, size, dir, colorA, colorB);
    }

    // Lily pads and flowers at the surface.
    for (let i = 0; i < 7; i++) {
      const driftX =
        cameraX +
        ((i * 281 + time * (5 + i * .65)) % (W + 280)) -
        120;
      const driftY =
        waterY +
        42 +
        (i % 3) * 34 +
        Math.sin(time * .72 + i) * 4;
      const padSize = 11 + (i % 3) * 3;

      ctx.save();
      ctx.translate(driftX, driftY);
      ctx.rotate(Math.sin(time * .31 + i) * .15);
      ctx.globalAlpha = lerp(.10, .72, day);

      ctx.fillStyle = mixColor("#4d354f", "#72a98a", day);
      ctx.beginPath();
      ctx.ellipse(0, 0, padSize * 1.45, padSize * .56, 0, 0, Math.PI * 2);
      ctx.lineTo(2, 0);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = mixColor("#65445f", "#a7d4a7", day);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-padSize * .7, 0);
      ctx.lineTo(padSize * .65, 0);
      ctx.stroke();

      if (i % 2 === 0) {
        ctx.fillStyle = i % 4 === 0
          ? mixColor("#ffd1e7", "#fff0bd", day)
          : mixColor("#f4a7cf", "#ffd2cd", day);

        for (let petal = 0; petal < 5; petal++) {
          const angle = petal * Math.PI * 2 / 5;
          ctx.beginPath();
          ctx.ellipse(
            Math.cos(angle) * 4,
            Math.sin(angle) * 4 - 2,
            3.4,
            1.9,
            angle,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }

        ctx.fillStyle = "#fff0a8";
        ctx.beginPath();
        ctx.arc(0, -2, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Sea grass and shell details along the river bed.
    const plantStart = Math.floor((cameraX - 140) / 250) * 250;
    for (let x = plantStart; x < cameraX + W + 180; x += 250) {
      const baseY = H - 7;
      const sway = Math.sin(time * 1.2 + x * .013) * 8;

      ctx.save();
      ctx.globalAlpha = lerp(.11, .62, day);
      ctx.strokeStyle = mixColor("#46344f", "#6d9f82", day);
      ctx.lineWidth = 3;
      ctx.lineCap = "round";

      for (let blade = 0; blade < 4; blade++) {
        const bx = x + 28 + blade * 8;
        const height = 24 + blade * 7 + Math.abs(Math.sin(x + blade)) * 10;
        ctx.beginPath();
        ctx.moveTo(bx, baseY);
        ctx.quadraticCurveTo(
          bx + sway * (.45 + blade * .08),
          baseY - height * .55,
          bx + sway,
          baseY - height
        );
        ctx.stroke();
      }

      ctx.fillStyle = mixColor("#5c4058", "#efb28f", day);
      ctx.beginPath();
      ctx.arc(x + 78, baseY - 5, 7, Math.PI, Math.PI * 2);
      ctx.lineTo(x + 85, baseY - 5);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = mixColor("#75526d", "#ffe3bd", day);
      ctx.lineWidth = 1;
      for (let ridge = 1; ridge < 4; ridge++) {
        ctx.beginPath();
        ctx.arc(x + 78, baseY - 5, ridge * 1.6, Math.PI, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Surface glints and heart-shaped ripples.
    for (let i = 0; i < 16; i++) {
      const x =
        cameraX +
        ((i * 239 + Math.sin(time * .42 + i) * 76) % (W + 180)) -
        50;
      const y =
        waterY +
        34 +
        ((i * 73) % Math.max(90, H - waterY - 58));
      const pulse = .55 + Math.sin(time * 1.8 + i) * .35;

      ctx.save();
      ctx.globalAlpha = lerp(.11, .44, day) * pulse;

      if (i % 3 === 0) {
        ctx.strokeStyle = i % 2 === 0 ? "#fff4d5" : "#ffe8f3";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.ellipse(x, y, 12 + pulse * 6, 4 + pulse * 2, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.fillStyle = i % 2 === 0 ? "#fff0da" : "#ffe8f4";
        ctx.translate(x, y);
        ctx.rotate(Math.PI / 4);
        ctx.fillRect(-1.5, -6, 3, 12);
        ctx.fillRect(-6, -1.5, 12, 3);
      }
      ctx.restore();
    }

    for (let i = 0; i < 12; i++) {
      const bubbleBaseX = clusterStart + i * 180 + 44;
      const x = bubbleBaseX + Math.sin(time * .8 + i) * 6;
      const y = H - 30 - ((time * 34 + i * 23) % 95);

      ctx.save();
      ctx.globalAlpha = lerp(.05, .22, day);
      ctx.strokeStyle = "#fff8fc";
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(x, y, 2.5 + (i % 3), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.globalAlpha = 1;
  }

  function drawPlatform(index, y, day) {
    const p = platforms[index];
    const waterSurface = H * waterYRatio;
    const time = performance.now() * .001;
    const float = Math.sin(time * .38 + index * .67) * .12;
    const py = y + float;
    const halfW = p.width / 2;

    // Small deterministic variations stop every slab from looking copied.
    const leftChip = 7 + ((index * 5) % 8);
    const rightChip = 8 + ((index * 7) % 9);
    const topBump = Math.sin(index * 1.31) * 2.2;
    const lowerBump = Math.cos(index * .91) * 2.0;
    const stoneDepth = 22;

    ctx.save();

    // Palette-matched reflection and shadow beneath each stone.
    const waterGlow = ctx.createRadialGradient(
      p.x,
      waterSurface + 4,
      2,
      p.x,
      waterSurface + 5,
      p.width * .58
    );
    waterGlow.addColorStop(
      0,
      `rgba(241, 125, 176, ${lerp(.18, .24, day)})`
    );
    waterGlow.addColorStop(
      .5,
      `rgba(187, 73, 137, ${lerp(.09, .14, day)})`
    );
    waterGlow.addColorStop(1, "rgba(187, 73, 137, 0)");

    ctx.fillStyle = waterGlow;
    ctx.beginPath();
    ctx.ellipse(
      p.x,
      waterSurface + 6,
      p.width * .58,
      12,
      0,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = `rgba(72, 25, 67, ${lerp(.23, .12, day)})`;
    ctx.beginPath();
    ctx.ellipse(
      p.x,
      waterSurface + 6,
      p.width * .42,
      5.2,
      0,
      0,
      Math.PI * 2
    );
    ctx.fill();

    ctx.strokeStyle =
      `rgba(255, 225, 240, ${lerp(.14, .29, day)})`;
    ctx.lineWidth = 1.05;

    ctx.beginPath();
    ctx.ellipse(
      p.x,
      waterSurface + 5,
      p.width * .48,
      6.4,
      0,
      0,
      Math.PI * 2
    );
    ctx.stroke();

    ctx.globalAlpha = .44;
    ctx.beginPath();
    ctx.ellipse(
      p.x,
      waterSurface + 5,
      p.width * .61,
      9.2,
      0,
      0,
      Math.PI * 2
    );
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Stacked broken ledges behind the main slab create visible depth.
    const backLayers = [
      {
        widthScale: 1.08,
        dx: -3 + Math.sin(index * .83) * 2,
        dy: 7,
        depth: 13,
        alpha: .92,
        topNight: "#bc4c89",
        topDay: "#ce718b",
        bottomNight: "#71305f",
        bottomDay: "#87506c"
      },
      {
        widthScale: .91,
        dx: 7 + Math.cos(index * .71) * 2,
        dy: 15,
        depth: 12,
        alpha: .80,
        topNight: "#9e3e79",
        topDay: "#b8617c",
        bottomNight: "#5e2855",
        bottomDay: "#74455f"
      },
      {
        widthScale: .72,
        dx: -7 + Math.sin(index * .57) * 2,
        dy: 23,
        depth: 10,
        alpha: .68,
        topNight: "#803467",
        topDay: "#98526e",
        bottomNight: "#482044",
        bottomDay: "#62394f"
      }
    ];

    backLayers.forEach((layer, layerIndex) => {
      const layerHalfW = halfW * layer.widthScale;
      const layerX = p.x + layer.dx;
      const layerY = py + layer.dy;
      const notchA = 4 + ((index + layerIndex * 3) % 7);
      const notchB = 5 + ((index * 2 + layerIndex) % 6);

      const layerGradient = ctx.createLinearGradient(
        layerX,
        layerY - 3,
        layerX,
        layerY + layer.depth
      );
      layerGradient.addColorStop(
        0,
        mixColor(layer.topNight, layer.topDay, day)
      );
      layerGradient.addColorStop(
        1,
        mixColor(layer.bottomNight, layer.bottomDay, day)
      );

      ctx.save();
      ctx.globalAlpha = layer.alpha;
      ctx.fillStyle = layerGradient;
      ctx.beginPath();
      ctx.moveTo(layerX - layerHalfW + notchA, layerY);
      ctx.lineTo(layerX - layerHalfW * .52, layerY - 2);
      ctx.lineTo(layerX - layerHalfW * .14, layerY + 1);
      ctx.lineTo(layerX + layerHalfW * .22, layerY - 1);
      ctx.lineTo(layerX + layerHalfW - notchB, layerY + 1);
      ctx.lineTo(layerX + layerHalfW - 2, layerY + 5);
      ctx.lineTo(layerX + layerHalfW - 8, layerY + layer.depth);
      ctx.lineTo(layerX + layerHalfW * .28, layerY + layer.depth + 2);
      ctx.lineTo(layerX - layerHalfW * .18, layerY + layer.depth);
      ctx.lineTo(layerX - layerHalfW + 7, layerY + layer.depth - 2);
      ctx.lineTo(layerX - layerHalfW + 2, layerY + 5);
      ctx.closePath();
      ctx.fill();

      // Bright separator rim makes the stacked strata readable.
      ctx.globalAlpha = layer.alpha * lerp(.46, .62, day);
      ctx.strokeStyle = mixColor("#e98ab4", "#eba3a8", day);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(layerX - layerHalfW + notchA, layerY);
      ctx.lineTo(layerX - layerHalfW * .52, layerY - 2);
      ctx.lineTo(layerX - layerHalfW * .14, layerY + 1);
      ctx.lineTo(layerX + layerHalfW * .22, layerY - 1);
      ctx.lineTo(layerX + layerHalfW - notchB, layerY + 1);
      ctx.stroke();

      // A small crack on each visible layer.
      ctx.globalAlpha = layer.alpha * .35;
      ctx.strokeStyle = mixColor("#4f214b", "#6b3d50", day);
      ctx.lineWidth = .9;
      const crackX = layerX + (layerIndex - 1) * layerHalfW * .22;
      ctx.beginPath();
      ctx.moveTo(crackX, layerY + 1);
      ctx.lineTo(crackX - 2, layerY + 5);
      ctx.lineTo(crackX + 2, layerY + 9);
      ctx.stroke();

      ctx.restore();
    });

    // Crumbling stone body.
    const stoneGradient = ctx.createLinearGradient(
      p.x,
      py - 5,
      p.x,
      py + stoneDepth + 5
    );
    stoneGradient.addColorStop(
      0,
      mixColor("#ffdce9", "#ffe7df", day)
    );
    stoneGradient.addColorStop(
      .30,
      mixColor("#ec8db5", "#eea1ae", day)
    );
    stoneGradient.addColorStop(
      .70,
      mixColor("#c34f8c", "#ce718e", day)
    );
    stoneGradient.addColorStop(
      1,
      mixColor("#7f2e6a", "#955170", day)
    );

    ctx.fillStyle = stoneGradient;
    ctx.beginPath();
    ctx.moveTo(p.x - halfW + leftChip, py + 3);
    ctx.lineTo(p.x - halfW * .58, py - 1 + topBump);
    ctx.lineTo(p.x - halfW * .20, py + 1);
    ctx.lineTo(p.x + halfW * .10, py - 2 - topBump * .45);
    ctx.lineTo(p.x + halfW * .48, py + 1 + topBump * .25);
    ctx.lineTo(p.x + halfW - rightChip, py + 3);
    ctx.lineTo(p.x + halfW - 4, py + 9);
    ctx.lineTo(p.x + halfW - 11, py + 14);
    ctx.lineTo(p.x + halfW - 8, py + stoneDepth - 4);
    ctx.lineTo(p.x + halfW * .46, py + stoneDepth + lowerBump);
    ctx.lineTo(p.x + halfW * .18, py + stoneDepth - 1);
    ctx.lineTo(p.x - halfW * .14, py + stoneDepth + 3 - lowerBump * .35);
    ctx.lineTo(p.x - halfW * .44, py + stoneDepth);
    ctx.lineTo(p.x - halfW + 9, py + stoneDepth - 5);
    ctx.lineTo(p.x - halfW + 4, py + 13);
    ctx.closePath();
    ctx.fill();

    // Pale upper edge catches the sky color.
    ctx.strokeStyle = day < .5
      ? "rgba(255, 210, 232, .48)"
      : "rgba(255, 238, 229, .66)";
    ctx.lineWidth = 1.35;
    ctx.beginPath();
    ctx.moveTo(p.x - halfW + leftChip, py + 3);
    ctx.lineTo(p.x - halfW * .58, py - 1 + topBump);
    ctx.lineTo(p.x - halfW * .20, py + 1);
    ctx.lineTo(p.x + halfW * .10, py - 2 - topBump * .45);
    ctx.lineTo(p.x + halfW * .48, py + 1 + topBump * .25);
    ctx.lineTo(p.x + halfW - rightChip, py + 3);
    ctx.stroke();

    // Subtle top highlight.
    ctx.save();
    ctx.globalAlpha = lerp(.22, .33, day);
    ctx.strokeStyle = "#fff8fb";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(p.x - halfW * .48, py + 4);
    ctx.quadraticCurveTo(
      p.x - halfW * .08,
      py - 1,
      p.x + halfW * .37,
      py + 4
    );
    ctx.stroke();
    ctx.restore();

    // Crack network.
    ctx.save();
    ctx.globalAlpha = lerp(.34, .42, day);
    ctx.strokeStyle = mixColor("#7f315f", "#98536a", day);
    ctx.lineWidth = 1.05;
    ctx.lineCap = "round";

    const crackX = p.x - halfW * .12 + ((index % 3) - 1) * 6;
    ctx.beginPath();
    ctx.moveTo(crackX, py + 2);
    ctx.lineTo(crackX - 3, py + 8);
    ctx.lineTo(crackX + 2, py + 12);
    ctx.lineTo(crackX - 1, py + 18);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(crackX - 2, py + 9);
    ctx.lineTo(crackX - 11, py + 12);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(crackX + 1, py + 13);
    ctx.lineTo(crackX + 10, py + 16);
    ctx.stroke();
    ctx.restore();

    // A couple of tiny broken chips hover close to the main slab.
    const chipColor = mixColor("#b74682", "#c96e86", day);
    ctx.fillStyle = chipColor;

    ctx.save();
    ctx.translate(p.x - halfW - 5, py + 14);
    ctx.rotate(-.22);
    ctx.beginPath();
    ctx.moveTo(-3, -2);
    ctx.lineTo(4, -1);
    ctx.lineTo(2, 4);
    ctx.lineTo(-4, 2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    if (index % 3 !== 1) {
      ctx.save();
      ctx.translate(p.x + halfW + 4, py + 11);
      ctx.rotate(.28);
      ctx.beginPath();
      ctx.moveTo(-3, -2);
      ctx.lineTo(3, -1);
      ctx.lineTo(2, 3);
      ctx.lineTo(-4, 2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Foreground fragments overlap the slab slightly for z-depth.
    const frontRockColor = mixColor("#b94a86", "#ca6f87", day);
    [
      { dx: -halfW * .56, dy: stoneDepth + 8, scale: .72, rot: .18 },
      { dx:  halfW * .50, dy: stoneDepth + 11, scale: .60, rot: -.22 }
    ].forEach((rock, rockIndex) => {
      if ((index + rockIndex) % 3 === 1) return;

      ctx.save();
      ctx.translate(p.x + rock.dx, py + rock.dy);
      ctx.rotate(rock.rot);
      ctx.globalAlpha = .88;
      ctx.fillStyle = frontRockColor;
      ctx.beginPath();
      ctx.moveTo(-7 * rock.scale, -3 * rock.scale);
      ctx.lineTo(5 * rock.scale, -4 * rock.scale);
      ctx.lineTo(8 * rock.scale, 2 * rock.scale);
      ctx.lineTo(1 * rock.scale, 7 * rock.scale);
      ctx.lineTo(-8 * rock.scale, 3 * rock.scale);
      ctx.closePath();
      ctx.fill();

      ctx.globalAlpha = .30;
      ctx.strokeStyle = mixColor("#f08fb8", "#eea0a1", day);
      ctx.lineWidth = .8;
      ctx.beginPath();
      ctx.moveTo(-4 * rock.scale, -1 * rock.scale);
      ctx.lineTo(3 * rock.scale, -2 * rock.scale);
      ctx.stroke();
      ctx.restore();
    });

    // Hanging heart charm beneath selected stones.
    if (
      index > 0 &&
      index < platforms.length - 1 &&
      index % 6 === 3
    ) {
      const charmX = p.x + (index % 2 === 0 ? -halfW * .22 : halfW * .22);
      const stringTop = py + stoneDepth - 1;
      const stringLength = 10 + (index % 3) * 3;

      ctx.strokeStyle =
        `rgba(255, 200, 225, ${lerp(.42, .58, day)})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(charmX, stringTop);
      ctx.lineTo(charmX, stringTop + stringLength);
      ctx.stroke();

      ctx.save();
      ctx.translate(charmX, stringTop + stringLength + 5);
      ctx.globalAlpha = lerp(.62, .78, day);
      ctx.fillStyle = mixColor("#ef77ad", "#ed9b91", day);
      drawHeartShape(ctx, 0, 0, 5.2);
      ctx.restore();
    }

    ctx.restore();
  }

  function drawKeyPrompt(index, y, day) {
    const p = platforms[index];
    const success =
      correctKeyFeedback &&
      correctKeyFeedback.index === index
        ? correctKeyFeedback
        : null;
    const error =
      wrongKeyFeedback &&
      wrongKeyFeedback.index === index
        ? wrongKeyFeedback
        : null;
    const feedback = success || error;
    const effectT = feedback
      ? clamp(feedback.age / feedback.duration, 0, 1)
      : 0;
    const effectEase = smootherstep(effectT);
    const effectFade = success
      ? 1 - smootherstep(clamp((effectT - .70) / .30, 0, 1))
      : 1;

    const successPulse = success
      ? Math.sin(Math.PI * effectT) * .18
      : 0;
    const errorPulse = error
      ? Math.sin(Math.PI * effectT) * .07
      : 0;
    const idlePulse = Math.sin(performance.now() / 260) * .06;
    const pulse = 1 + idlePulse + successPulse + errorPulse;
    const rise = success ? effectEase * 14 : 0;
    const errorShake = error
      ? Math.sin(effectT * Math.PI * 9) * (1 - effectT) * 7
      : 0;

    ctx.save();
    ctx.translate(p.x + errorShake, y - 52 - rise);
    ctx.scale(pulse, pulse);
    ctx.globalAlpha = effectFade;

    if (success) {
      // Compact success glow and heart/spark burst.
      const glowRadius = 34 + effectEase * 18;
      const glow = ctx.createRadialGradient(
        0,
        0,
        4,
        0,
        0,
        glowRadius
      );
      glow.addColorStop(
        0,
        `rgba(255, 244, 250, ${.66 * effectFade})`
      );
      glow.addColorStop(
        .38,
        `rgba(255, 126, 183, ${.40 * effectFade})`
      );
      glow.addColorStop(1, "rgba(255, 104, 173, 0)");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      const burstRadius = 18 + effectEase * 30;
      for (let i = 0; i < 8; i++) {
        const angle = -Math.PI / 2 + i * Math.PI * 2 / 8;
        const sx = Math.cos(angle) * burstRadius;
        const sy = Math.sin(angle) * burstRadius;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(angle + Math.PI / 2);
        ctx.globalAlpha = (1 - effectT) * .88;

        if (i % 2 === 0) {
          ctx.fillStyle = i % 4 === 0 ? "#fff5fa" : "#ff85b9";
          drawHeartShape(ctx, 0, 0, 3.8 + effectEase * 1.2);
        } else {
          ctx.strokeStyle = i % 3 === 0 ? "#ffe3a8" : "#ffc0dc";
          ctx.lineWidth = 1.5;
          const ray = 3 + effectEase * 4;
          ctx.beginPath();
          ctx.moveTo(-ray, 0);
          ctx.lineTo(ray, 0);
          ctx.moveTo(0, -ray);
          ctx.lineTo(0, ray);
          ctx.stroke();
        }
        ctx.restore();
      }

      ctx.globalAlpha = (1 - effectT) * .58;
      ctx.strokeStyle = "#fff1f8";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.arc(0, 0, 29 + effectEase * 15, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = effectFade;
    }

    if (error) {
      // Compact red warning glow.
      const warningFade =
        1 - smootherstep(clamp((effectT - .66) / .34, 0, 1));
      const glowRadius = 33 + effectEase * 15;
      const redGlow = ctx.createRadialGradient(
        0,
        0,
        5,
        0,
        0,
        glowRadius
      );
      redGlow.addColorStop(
        0,
        `rgba(255, 226, 229, ${.54 * warningFade})`
      );
      redGlow.addColorStop(
        .36,
        `rgba(255, 64, 87, ${.42 * warningFade})`
      );
      redGlow.addColorStop(1, "rgba(151, 20, 43, 0)");
      ctx.fillStyle = redGlow;
      ctx.beginPath();
      ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      // Two warning rings moving outward.
      ctx.strokeStyle = "#ff8e9f";
      ctx.lineWidth = 2;
      ctx.globalAlpha = warningFade * .66;
      ctx.beginPath();
      ctx.arc(0, 0, 30 + effectEase * 12, 0, Math.PI * 2);
      ctx.stroke();

      ctx.globalAlpha = warningFade * .34;
      ctx.beginPath();
      ctx.arc(0, 0, 34 + effectEase * 19, 0, Math.PI * 2);
      ctx.stroke();

      // Crosses and tiny split-heart halves scatter outward.
      const burstRadius = 18 + effectEase * 28;
      for (let i = 0; i < 8; i++) {
        const angle = Math.PI / 8 + i * Math.PI * 2 / 8;
        const sx = Math.cos(angle) * burstRadius;
        const sy = Math.sin(angle) * burstRadius;

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(angle + effectT * .8);
        ctx.globalAlpha = (1 - effectT) * .82;

        if (i % 2 === 0) {
          ctx.strokeStyle = i % 4 === 0 ? "#fff0f2" : "#ff7188";
          ctx.lineWidth = 1.8;
          const cross = 3.6 + effectEase * 2.2;
          ctx.beginPath();
          ctx.moveTo(-cross, -cross);
          ctx.lineTo(cross, cross);
          ctx.moveTo(cross, -cross);
          ctx.lineTo(-cross, cross);
          ctx.stroke();
        } else {
          ctx.fillStyle = i % 3 === 0 ? "#ff9cab" : "#d94360";
          ctx.beginPath();
          ctx.arc(-2.1, -1.2, 2.5, Math.PI, Math.PI * 2);
          ctx.arc(2.1, -1.2, 2.5, Math.PI, Math.PI * 2);
          ctx.lineTo(0, 5.4);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = "#fff0f2";
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(-1, -3);
          ctx.lineTo(1, -1);
          ctx.lineTo(-1, 1);
          ctx.lineTo(1, 3);
          ctx.stroke();
        }
        ctx.restore();
      }

      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = success
      ? mixColor("#ff78ad", "#fff0e8", day)
      : error
        ? mixColor("#9f294a", "#d94b5e", day)
        : (
          day < .5
            ? "rgba(95, 24, 70, .88)"
            : `rgba(255, 205, 221, ${lerp(.88, .96, day)})`
        );
    roundRect(ctx, -26, -26, 52, 52, 15);
    ctx.fill();

    ctx.strokeStyle = success
      ? "rgba(255,255,255,.92)"
      : error
        ? "rgba(255, 224, 229, .92)"
        : (
          day < .5
            ? "rgba(255, 171, 211, .48)"
            : "rgba(184, 82, 126, .35)"
        );
    ctx.lineWidth = feedback ? 2.7 : 2;
    roundRect(ctx, -26, -26, 52, 52, 15);
    ctx.stroke();

    ctx.fillStyle = success
      ? mixColor("#fff9fc", "#983f65", day)
      : error
        ? "#fff4f5"
        : mixColor("#ffe2f0", "#8a3e60", day);
    ctx.font = '400 26px "Love Ya Like A Sister", cursive';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(p.key, 0, 1);

    ctx.restore();
  }


  function drawReunionHeart(day) {
    if (
      !(
        state === "reunion" ||
        state === "heartFlood" ||
        state === "ending"
      ) ||
      !transitionHeartSprites.length
    ) {
      return;
    }

    const appear =
      state === "reunion"
        ? smootherstep(clamp((stateTime - .34) / .62, 0, 1))
        : 1;
    const kissBoost =
      state === "reunion"
        ? smootherstep(clamp((stateTime - 1.48) / .48, 0, 1))
        : 1;
    const pulse =
      1 +
      Math.sin(performance.now() * .0048) * .075 +
      kissBoost * .12;

    // Twice the previous shared-heart size.
    const displaySize = (96 + kissBoost * 16) * pulse;
    const spriteIndex = day > .7 ? 5 : 1;
    const sprite = transitionHeartSprites[spriteIndex];

    const visibleKyleCenter = partner.x + 8;
    const centerX = (player.x + visibleKyleCenter) / 2;
    const characterTop = Math.min(
      player.y - 164 + 30,
      partner.y - 168 + 22
    );
    const centerY = characterTop - 58;

    ctx.save();
    ctx.globalAlpha = .94 * appear;
    ctx.drawImage(
      sprite,
      centerX - displaySize / 2,
      centerY - displaySize / 2,
      displaySize,
      displaySize
    );

    ctx.translate(centerX, centerY);
    ctx.strokeStyle = day > .6 ? "#fff0da" : "#ffd4ea";
    ctx.lineWidth = 1.6;
    ctx.globalAlpha = appear * (.54 + kissBoost * .24);
    for (let i = 0; i < 8; i++) {
      const angle =
        i * Math.PI / 4 +
        performance.now() * .00022;
      const radius = displaySize * .60;
      const sx = Math.cos(angle) * radius;
      const sy = Math.sin(angle) * radius;
      ctx.beginPath();
      ctx.moveTo(sx - 3.5, sy);
      ctx.lineTo(sx + 3.5, sy);
      ctx.moveTo(sx, sy - 3.5);
      ctx.lineTo(sx, sy + 3.5);
      ctx.stroke();
    }

    ctx.restore();
  }


  function drawCharacter(
    x,
    platformYValue,
    name,
    shirt,
    hair,
    facing,
    isHer,
    day
  ) {
    const time = performance.now() * .001;
    const bob = Math.sin(player.bob + x * .01) * 1.25;
    const photo = isHer ? characterPhotos.her : characterPhotos.you;

    const drawH = isHer ? 164 : 168;
    const fallbackAspect = isHer ? .76 : .90;
    const aspect =
      photo.complete && photo.naturalWidth > 0
        ? photo.naturalWidth / photo.naturalHeight
        : fallbackAspect;
    const drawW = drawH * aspect;

    const feetY = platformYValue - 1 + bob;

    // They do a short synchronized two-step, then lean inward for a
    // held scrapbook-style kiss pose.
    const reunionActive =
      state === "reunion" ||
      state === "heartFlood" ||
      state === "ending";
    const danceRamp =
      state === "reunion"
        ? smootherstep(clamp((stateTime - .30) / .38, 0, 1))
        : 0;
    const danceFade =
      state === "reunion"
        ? 1 - smootherstep(clamp((stateTime - 1.34) / .34, 0, 1))
        : 0;
    const danceAmount = danceRamp * danceFade;
    const danceClock = Math.max(0, stateTime - .30);
    const danceWave = Math.sin(danceClock * Math.PI * 2.65);
    const danceBounce =
      danceAmount *
      Math.abs(Math.sin(danceClock * Math.PI * 5.3)) *
      5.5;
    const danceSide =
      danceAmount * danceWave * (isHer ? -3.5 : 3.5);
    const danceTilt =
      danceAmount * danceWave * (isHer ? -.075 : .075);

    const kissAmount =
      state === "reunion"
        ? smootherstep(clamp((stateTime - 1.48) / .48, 0, 1))
        : (
          state === "heartFlood" || state === "ending"
            ? 1
            : 0
        );
    const kissSide = kissAmount * (isHer ? 10 : -10);
    const kissLift = kissAmount * (isHer ? 1.5 : 0);
    const kissTilt = kissAmount * (isHer ? .105 : -.105);
    const kissPulse =
      kissAmount *
      Math.sin(
        (state === "reunion" ? stateTime : time) * 4.2
      ) *
      .008;

    const characterVerticalOffset = isHer ? 8 : 0;
    const centerY =
      feetY -
      drawH / 2 +
      23 +
      characterVerticalOffset -
      danceBounce -
      kissLift;

    const reunionLean = reunionActive
      ? (isHer ? .052 : -.052)
      : 0;
    const idleTilt =
      (isHer ? -.025 : .025) +
      Math.sin(time * .72 + x * .002) * .006;
    const tilt =
      idleTilt +
      reunionLean +
      danceTilt +
      kissTilt +
      kissPulse;

    // Treiorika uses the original cutout direction; Kyle remains unchanged.
    const photoDirection = 1;

    const characterCenterOffset = isHer ? 0 : 8;

    ctx.save();
    ctx.translate(
      x + characterCenterOffset + danceSide + kissSide,
      centerY
    );
    ctx.rotate(tilt);
    ctx.scale(photoDirection, 1);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (photo.complete && photo.naturalWidth > 0) {
      const x0 = -drawW / 2;
      const y0 = -drawH / 2;

      ctx.drawImage(photo, x0, y0, drawW, drawH);

      // Tiny scrapbook doodles.
      ctx.strokeStyle = mixColor("#cd679e", "#e18a90", day);
      ctx.lineWidth = 1.15;
      ctx.globalAlpha = .76;

      ctx.save();
      ctx.translate(drawW / 2 + 7, -drawH * .16);
      ctx.rotate(.14);
      ctx.beginPath();
      ctx.moveTo(0, 2);
      ctx.bezierCurveTo(-5, -3, -9, 3, 0, 10);
      ctx.bezierCurveTo(9, 3, 5, -3, 0, 2);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.translate(-drawW / 2 - 8, drawH * .18);
      ctx.rotate(-.15);
      ctx.beginPath();
      ctx.moveTo(-4, 0);
      ctx.lineTo(4, 0);
      ctx.moveTo(0, -4);
      ctx.lineTo(0, 4);
      ctx.stroke();
      ctx.restore();

      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = isHer
        ? mixColor("#c7839c", "#e8aeb8", day)
        : mixColor("#6d8fb0", "#95b0ca", day);
      roundRect(ctx, -26, -42, 52, 84, 8);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = '400 24px "Love Light", cursive';
      ctx.fillText(isHer ? "T" : "K", 0, 0);
    }

    ctx.restore();

    const nameAlpha =
      state === "reunion"
        ? 1 - smootherstep(clamp(stateTime / .55, 0, 1))
        : (
          state === "heartFlood" || state === "ending"
            ? 0
            : 1
        );

    if (nameAlpha > .01) {
      ctx.save();
      ctx.globalAlpha = nameAlpha;
      ctx.textAlign = "center";
      ctx.fillStyle =
        day < .55
          ? "rgba(255,255,255,.92)"
          : `rgba(88,40,68,${lerp(.90, .97, day)})`;
      ctx.font = '400 16px "Love Ya Like A Sister", cursive';
      ctx.fillText(
        name,
        x,
        platformYValue - drawH + 14 + bob - danceBounce
      );
      ctx.restore();
    }
  }


  function buildTransitionHeartSprites() {
    const colors = [
      "#ff5fa3",
      "#ff8fc2",
      "#d873a8",
      "#ffd1e6",
      "#ff7895",
      "#ff9eb5",
      "#ffd0a6",
      "#fff0c7",
      "#e886a8"
    ];

    transitionHeartSprites = colors.map(color => {
      const sprite = document.createElement("canvas");
      sprite.width = 128;
      sprite.height = 128;
      const spriteCtx = sprite.getContext("2d");

      spriteCtx.translate(64, 67);
      spriteCtx.fillStyle = color;
      spriteCtx.shadowColor = "rgba(255, 97, 157, .34)";
      spriteCtx.shadowBlur = 12;
      drawHeartShape(spriteCtx, 0, 0, 34);

      spriteCtx.shadowBlur = 0;
      spriteCtx.globalAlpha = .34;
      spriteCtx.fillStyle = "#ffffff";
      spriteCtx.beginPath();
      spriteCtx.ellipse(-11, -18, 5, 10, -.5, 0, Math.PI * 2);
      spriteCtx.fill();

      return sprite;
    });
  }

  function drawTransitionSparkles() {
    transitionSparkles.forEach(sparkle => {
      const alpha = clamp(sparkle.life / .42, 0, 1);

      ctx.save();
      ctx.translate(sparkle.x, sparkle.y);
      ctx.rotate(sparkle.rotation);
      ctx.globalAlpha = alpha * .82;
      ctx.strokeStyle = sparkle.color;
      ctx.shadowColor = sparkle.color;
      ctx.shadowBlur = 5;
      ctx.lineWidth = 1.35;
      ctx.lineCap = "round";

      ctx.beginPath();
      ctx.moveTo(-sparkle.size, 0);
      ctx.lineTo(sparkle.size, 0);
      ctx.moveTo(0, -sparkle.size);
      ctx.lineTo(0, sparkle.size);
      ctx.stroke();

      ctx.globalAlpha = alpha * .28;
      ctx.beginPath();
      ctx.moveTo(-sparkle.size * .48, -sparkle.size * .48);
      ctx.lineTo(sparkle.size * .48, sparkle.size * .48);
      ctx.moveTo(sparkle.size * .48, -sparkle.size * .48);
      ctx.lineTo(-sparkle.size * .48, sparkle.size * .48);
      ctx.stroke();

      ctx.shadowBlur = 0;

      ctx.restore();
    });

    ctx.globalAlpha = 1;
  }

  function drawTransitionHearts() {
    transitionHearts.forEach(heart => {
      const sprite = transitionHeartSprites[heart.spriteIndex];
      if (!sprite) return;

      const displaySize = heart.size * heart.scale * 2.4;

      ctx.save();
      ctx.translate(heart.x, heart.y);
      ctx.rotate(heart.rotation);
      ctx.globalAlpha = heart.alpha * clamp(heart.life / .38, 0, 1);
      ctx.drawImage(
        sprite,
        -displaySize / 2,
        -displaySize / 2,
        displaySize,
        displaySize
      );
      ctx.restore();
    });

    ctx.globalAlpha = 1;
  }


  function spawnBackgroundHeart() {
    backgroundHearts.push({
      x: Math.random() * W,
      y: -35 - Math.random() * 100,
      speed: 20 + Math.random() * 32,
      drift: 4 + Math.random() * 12,
      size: 5 + Math.random() * 10,
      alpha: .15 + Math.random() * .32,
      rotation: Math.random() * Math.PI * 2,
      spin: (Math.random() - .5) * .7,
      phase: Math.random() * Math.PI * 2,
      tone: Math.random()
    });
  }

  function drawBackgroundHearts(day) {
    backgroundHearts.forEach(heart => {
      const nightA = heart.tone > .5 ? "#ff79b5" : "#c77aa7";
      const dayA = heart.tone > .5 ? "#c9697e" : "#cfa36f";

      ctx.save();
      ctx.translate(heart.x, heart.y);
      ctx.rotate(heart.rotation);
      ctx.globalAlpha = heart.alpha * lerp(.78, 1, day);
      ctx.fillStyle = mixColor(nightA, dayA, day);
      drawHeartShape(ctx, 0, 0, heart.size);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }

  function drawHeartParticle(p, day) {
    const sprite = transitionHeartSprites[p.spriteIndex];
    if (!sprite) return;

    const displaySize = p.size * 2.4;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.globalAlpha = Math.min(1, p.life);
    ctx.drawImage(
      sprite,
      -displaySize / 2,
      -displaySize / 2,
      displaySize,
      displaySize
    );
    ctx.restore();
  }

  function drawHeartShape(context, x, y, size) {
    context.beginPath();
    context.moveTo(x, y + size * .3);
    context.bezierCurveTo(
      x - size * 1.1, y - size * .35,
      x - size * .65, y - size,
      x, y - size * .45
    );
    context.bezierCurveTo(
      x + size * .65, y - size,
      x + size * 1.1, y - size * .35,
      x, y + size * .3
    );
    context.fill();
  }

  function fadeWindow(t, fadeInStart, fullStart, fullEnd, fadeOutEnd) {
    if (t <= fadeInStart || t >= fadeOutEnd) return 0;
    if (t < fullStart) return smoothstep((t - fadeInStart) / (fullStart - fadeInStart));
    if (t <= fullEnd) return 1;
    return 1 - smoothstep((t - fullEnd) / (fadeOutEnd - fullEnd));
  }

  function smoothstep(value) {
    const t = clamp(value, 0, 1);
    return t * t * (3 - 2 * t);
  }

  function smootherstep(value) {
    const t = clamp(value, 0, 1);
    return t * t * t * (t * (t * 6 - 15) + 10);
  }

  function clamp(value, min, max) {
    return Math.min(max, Math.max(min, value));
  }

  function hexToRgb(hex) {
    const cleaned = hex.replace("#", "");
    const value = Number.parseInt(cleaned, 16);
    return {
      r: (value >> 16) & 255,
      g: (value >> 8) & 255,
      b: value & 255
    };
  }

  function mixColor(a, b, amount) {
    const start = hexToRgb(a);
    const end = hexToRgb(b);
    const t = clamp(amount, 0, 1);
    const r = Math.round(lerp(start.r, end.r, t));
    const g = Math.round(lerp(start.g, end.g, t));
    const blue = Math.round(lerp(start.b, end.b, t));
    return `rgb(${r}, ${g}, ${blue})`;
  }

  function setUiPalette(day) {
    const root = document.documentElement.style;
    const lightPanelAlpha = lerp(.78, .74, day);

    root.setProperty(
      "--panel",
      day < .5
        ? `rgba(19, 9, 27, ${lightPanelAlpha})`
        : `rgba(255, 247, 250, ${lightPanelAlpha})`
    );
    root.setProperty("--hud-text", mixColor("#ffe8f4", "#68364f", day));
    root.setProperty(
      "--key-bg",
      day < .5
        ? "rgba(93, 25, 69, .82)"
        : `rgba(247, 183, 207, ${lerp(.86, .96, day)})`
    );
    root.setProperty("--key-text", mixColor("#ffd9eb", "#7e3457", day));
    root.setProperty(
      "--key-active",
      day < .5
        ? "rgba(219, 69, 139, .70)"
        : "rgba(213, 112, 149, .76)"
    );
    root.setProperty("--progress-a", mixColor("#ff6cae", "#f283a0", day));
    root.setProperty("--progress-b", mixColor("#ffd2e7", "#ffe0ae", day));
    root.setProperty(
      "--track-bg",
      day < .5 ? "rgba(255,255,255,.12)" : "rgba(240,218,225,.40)"
    );
    root.setProperty(
      "--track-border",
      day < .5 ? "rgba(255,255,255,.13)" : "rgba(126,65,94,.18)"
    );
    root.setProperty(
      "--ending-overlay",
      day < .5 ? "rgba(39,8,30,.34)" : "rgba(255,224,237,.28)"
    );
    root.setProperty(
      "--ending-card-bg",
      day < .5 ? "rgba(20, 8, 28, .88)" : "rgba(255, 248, 244, .92)"
    );
    root.setProperty(
      "--ending-glow",
      day < .5 ? "rgba(255, 101, 174, .24)" : "rgba(255, 176, 137, .34)"
    );
    root.setProperty("--ending-title", mixColor("#fff5fb", "#63344c", day));
    root.setProperty("--ending-copy", mixColor("#ead2df", "#7a4a5c", day));
  }

  function roundRect(context, x, y, width, height, radius) {
    const r = Math.min(radius, width / 2, height / 2);
    context.beginPath();
    context.moveTo(x + r, y);
    context.arcTo(x + width, y, x + width, y + height, r);
    context.arcTo(x + width, y + height, x, y + height, r);
    context.arcTo(x, y + height, x, y, r);
    context.arcTo(x, y, x + width, y, r);
    context.closePath();
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function loop(now) {
    if (document.hidden) {
      lastTime = now;
      requestAnimationFrame(loop);
      return;
    }

    const dt = Math.min(.033, (now - lastTime) / 1000 || 0);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  gameInitialized = true;
  resize();
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
